}
const NB={b:'<b>B</b>',i:'<i>I</i>',u:'<u>U</u>',ul:'<svg viewBox="0 0 24 24"><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>',ol:'<svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14h3l-3 3h3"/></svg>',link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg>',hr:'<svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg>',undo:'<svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>',redo:'<svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg>'};
function noteEditorHTML(n){
  return`<div class="ne-head"><input id="neTitle" class="ne-title" placeholder="Untitled note" value="${esc(n.title||'')}" oninput="noteField('title',this.value)"><div class="ne-meta">${dateInput({value:n.date||'',cb:"noteField('date',v)",title:'Date of the meeting or note'})}<select onchange="noteField('tag',this.value)" title="Type">${NOTE_TAGS.map(t=>`<option${t===n.tag?' selected':''}>${esc(t)}</option>`).join('')}</select><button type="button" class="nbtn${n.pinned?' on':''}" onclick="togglePinNote()">${n.pinned?'Pinned':'Pin'}</button><button type="button" class="nbtn" onclick="insertMeetingTemplate()" title="Adds Attendees, Agenda, Notes and Action items">Meeting template</button><button type="button" class="nbtn del" onclick="deleteNote()">Delete</button></div></div><div class="ne-tb"><select onchange="ncmd('formatBlock',this.value);this.selectedIndex=0"><option>Style</option><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Callout</option></select><button type="button" title="Bold" onclick="ncmd('bold')">${NB.b}</button><button type="button" title="Italic" onclick="ncmd('italic')">${NB.i}</button><button type="button" title="Underline" onclick="ncmd('underline')">${NB.u}</button><button type="button" title="Bulleted list" onclick="ncmd('insertUnorderedList')">${NB.ul}</button><button type="button" title="Numbered list" onclick="ncmd('insertOrderedList')">${NB.ol}</button><button type="button" title="Link" onclick="noteLink()">${NB.link}</button><button type="button" title="Divider" onclick="ncmd('insertHorizontalRule')">${NB.hr}</button><button type="button" title="Undo" onclick="ncmd('undo')">${NB.undo}</button><button type="button" title="Redo" onclick="ncmd('redo')">${NB.redo}</button></div><div id="neBody" class="ne-body" contenteditable="true" spellcheck="true" oninput="noteBodyInput()" onpaste="notePaste()">${n.body||''}</div><div class="ne-foot"><span id="neStatus">Saved</span><span>Last edited ${esc(new Date(n.updated||Date.now()).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</span></div>`

  if(!curNote()&&notes.length)noteSel=sortedNotes()[0].id;
  let n=curNote();
  notesView.innerHTML=`<div class="band teal"><div class="band-l"><h1>Notes</h1><span class="band-sub">${notes.length} note${notes.length===1?'':'s'}</span></div><div class="band-r"><button type="button" class="btn bprimary" onclick="newNote()">+ New Note</button></div></div><div class="notes-wrap"><div class="nl"><input id="nlSearch" class="nl-search" placeholder="Search notes" value="${esc(noteQuery)}" oninput="noteSearch(this.value)"><div class="nl-items" id="nlItems">${noteListHTML()}</div></div><div class="ne" id="neWrap">${n?noteEditorHTML(n):'<div class="ne-empty">Pick a note, or start a new one.<br><br><button type="button" class="nbtn" onclick="newNote()">+ New Note</button></div>'}</div></div>`
}
function renderNoteList(){let el=document.getElementById('nlItems');if(el)el.innerHTML=noteListHTML()}
function noteSearch(v){noteQuery=v;renderNoteList()}
function selectNote(id){flushNote();noteSel=id;renderNotes()}
function openNote(id){noteSel=id;if(view==='notes')renderNotes();else setView('notes')}
function newNote(){
  flushNote();
  let n={id:crypto.randomUUID(),title:'',date:todayISO(),tag:'General',body:'',pinned:false,created:Date.now(),updated:Date.now()};
  notes.unshift(n);noteSel=n.id;noteQuery='';persistNotes();renderNotes();
  setTimeout(()=>{let t=document.getElementById('neTitle');if(t)t.focus()},40)
}
function quickNote(){setView('notes');newNote()}
function noteField(k,v){let n=curNote();if(!n)return;n[k]=v;n.updated=Date.now();schedNoteSave()}
function noteBodyInput(){let n=curNote(),b=document.getElementById('neBody');if(!n||!b)return;n.body=b.innerHTML;n.updated=Date.now();schedNoteSave()}
function schedNoteSave(){noteDirty=true;let s=document.getElementById('neStatus');if(s)s.textContent='Saving…';clearTimeout(noteTimer);noteTimer=setTimeout(flushNote,500)}
function flushNote(){
  clearTimeout(noteTimer);
  if(!noteDirty)return;noteDirty=false;persistNotes();renderNoteList();
  let s=document.getElementById('neStatus');if(s)s.textContent='Saved'
}
function ncmd(c,v){let b=document.getElementById('neBody');if(!b)return;b.focus();document.execCommand(c,false,v==='p'?'<p>':(['h1','h2','h3','blockquote'].includes(v)?'<'+v+'>':v));noteBodyInput()}
function noteLink(){let u=prompt('Paste a link');if(u)ncmd('createLink',u)}
function notePaste(){setTimeout(()=>{let b=document.getElementById('neBody');if(!b)return;let imgs=b.querySelectorAll('img');if(imgs.length){imgs.forEach(i=>i.remove());toastMsg('Pictures cannot be pasted into notes yet. The text was kept.')}noteBodyInput()},0)}
function togglePinNote(){let n=curNote();if(!n)return;n.pinned=!n.pinned;n.updated=Date.now();flushNote();persistNotes();renderNotes()}
function insertMeetingTemplate(){
  let b=document.getElementById('neBody'),n=curNote();if(!b||!n)return;
  let t='<h2>Attendees</h2><p><br></p><h2>Agenda</h2><ul><li><br></li></ul><h2>Notes</h2><p><br></p><h2>Action items</h2><ul><li><br></li></ul>';
  if(!stripHtml(b.innerHTML))b.innerHTML=t;else b.insertAdjacentHTML('beforeend','<hr>'+t);
  noteBodyInput();b.focus()
}
function deleteNote(){
  let n=curNote();if(!n)return;
  if(!confirm('Delete "'+(n.title||'Untitled note')+'"?'))return;
  flushNote();lastDeletedNote={...n};
  notes=notes.filter(x=>x.id!==n.id);noteSel=null;persistNotes();renderNotes();
  toastMsg('Note deleted',{label:'Undo',fn:()=>{if(lastDeletedNote){notes.unshift(lastDeletedNote);noteSel=lastDeletedNote.id;lastDeletedNote=null;persistNotes();render();toastMsg('Note restored')}}})
}

let ideaQuery='',ideaTimer=null,lastDeletedIdea=null;
function autosizeTA(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function ideaCardsHTML(){
  let toks=ideaQuery.toLowerCase().split(/\s+/).filter(Boolean);
  let list=[...ideas].filter(i=>!toks.length||toks.every(t=>((i.title||'')+' '+(i.body||'')).toLowerCase().includes(t))).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated||0)-(a.updated||0));

  }).join('')
}

  ideasView.innerHTML=`<div class="band purple"><div class="band-l"><h1>Ideas</h1><span class="band-sub">${ideas.length} idea${ideas.length===1?'':'s'}</span></div><div class="band-r"><div class="idea-add"><input id="ideaNew" placeholder="Type an idea, press Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();addIdea()}"><button type="button" class="btn bprimary" onclick="addIdea()">Add</button></div><input class="idea-search" id="ideaSearch" placeholder="Search ideas" value="${esc(ideaQuery)}" oninput="ideaSearch(this.value)"></div></div><div class="ideas-grid" id="ideasGrid">${ideaCardsHTML()}</div>`;

function ideaSearch(v){ideaQuery=v;refreshIdeasGrid()}
function focusIdeaAdd(){setTimeout(()=>{let i=document.getElementById('ideaNew');if(i)i.focus()},50)}

  let inp=document.getElementById('ideaNew'),t=(inp&&inp.value||'').trim();

function ideaPin(id){let it=ideas.find(x=>x.id===id);if(!it)return;it.pinned=!it.pinned;it.updated=Date.now();persistNotes();refreshIdeasGrid()}

/* ---------- Workplan ---------- */
let wpSheet=localStorage.getItem('jpdWpSheet')||'',wpEditId=null,wpLinkId=null;
function wpAllRows(){let a=[];workplan.sheets.forEach(s=>s.groups.forEach(g=>g.rows.forEach(r=>a.push({sheet:s,group:g,row:r}))));return a}
function wpFindInfo(id){return wpAllRows().find(x=>x.row.id===id)||null}
function wpFindRow(id){let x=wpFindInfo(id);return x?x.row:null}
const WP_STOP=new Set(['the','of','and','a','event','notice','campaign','promotion','date']);
function wpSquash(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function wpTokens(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).map(t=>t.replace(/s$/,'')).filter(t=>t&&!WP_STOP.has(t))}
function wpMatch(row){
  if(row.pid==='none')return{kind:'none'};
  if(row.pid){let p=projects.find(x=>x.id===row.pid);if(p&&p.status!=='Complete')return{kind:'open',p};let a=archive.find(x=>x.id===row.pid);if(a)return{kind:'done',p:a}}
  let s1=wpSquash(row.name),t1=wpTokens(row.name),best=null,bs=0;
  projects.forEach(p=>{
    if(p.status==='Complete')return;
    let s2=wpSquash(p.project),score=0;
    if(s1.length>=6&&s2.length>=6&&(s2.includes(s1)||s1.includes(s2)))score=1;
    else{let t2=wpTokens(p.project),sh=t1.filter(t=>t2.includes(t)).length,un=new Set([...t1,...t2]).size;if(sh>=2&&un&&sh/un>=0.7)score=sh/un}
    if(score>bs){bs=score;best=p}
  });
  return best?{kind:'open',p:best,auto:true}:{kind:'none-linked'}
}
function wpBlock(months,i){let m=months.split('').map(c=>c==='1'),s=i,e=i,g=0;while(m[(s+11)%12]&&g++<12)s=(s+11)%12;g=0;while(m[(e+1)%12]&&g++<12)e=(e+1)%12;return MON3[s]+(s===e?'':'–'+MON3[e])}
function wpStarts(row){
  let m=row.months.split('').map(c=>c==='1'),on=m.filter(Boolean).length;
  if(on===0||on>=11)return null;
  let cur=new Date().getMonth(),nxt=(cur+1)%12;
  if(m[cur])return{state:'now',label:'Active now ('+wpBlock(row.months,cur)+')'};
  if(m[nxt])return{state:'soon',label:'Starts in '+MONTH_NAMES[nxt]+' ('+wpBlock(row.months,nxt)+')'};
  return null
}
function wpSoonList(){

/* ---------- Workplan → Excel (a small .xlsx writer, no outside libraries) ---------- */
const CRC_T=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  let parts=[],central=[],offset=0;
  files.forEach(f=>{
    let nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    let lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),nm);
    offset+=lh.length+nm.length+sz
  });
  let cdSize=central.reduce((n,a)=>n+a.length,0);
  let end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(offset),...u16(0)]);
  let all=[...parts,...central,end],out=new Uint8Array(all.reduce((n,a)=>n+a.length,0)),p=0;
  all.forEach(a=>{out.set(a,p);p+=a.length});return out
}
function xEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function xCol(i){let s='';while(i>0){let m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
const WP_SHEET_FILLS=['9DC3E6','A9D18E','B4A7D6','FFD966','D9EAD3'],WP_CH_FILLS=['5B9BD5','70AD47','F4B183','8064A2','C00000','7F7F7F'];

function xFill(r,c,s){return`<c r="${xCol(c)}${r}" s="${s}"/>`}
function xSheet(sheet,idx){

    r++;rows.push(`<row r="${r}" ht="26" customHeight="1">${xText(r,1,g.name,1)}${Array.from({length:19},(_,i)=>xFill(r,i+2,1)).join('')}</row>`);merges.push(`A${r}:T${r}`);
    r++;rows.push(`<row r="${r}" ht="32" customHeight="1">${xText(r,1,'Project / Initiative',2)}${MON3.map((m,i)=>xText(r,i+2,m,2)).join('')}${WP_CH.map((c,i)=>xText(r,14+i,c.label,2)).join('')}${xText(r,20,'Notes',2)}</row>`);
    g.rows.forEach(row=>{
      r++;let cells=xText(r,1,row.name+(row.isNew?' *NEW*':''),3);
      row.months.split('').forEach((c,i)=>{if(c==='1')cells+=xFill(r,i+2,mStyle)});

function buildWorkplanXlsx(){

    {name:'_rels/.rels',data:enc.encode(H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml',data:enc.encode(H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${nm(s)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels',data:enc.encode(H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)},
    {name:'xl/styles.xml',data:enc.encode(xStyles())}
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:enc.encode(xSheet(s,i))}));
  return zipStore(files)
}
function exportWorkplan(){
  let bytes=buildWorkplanXlsx(),b=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='Communications Workplan.xlsx';a.click();toastMsg('Workplan exported to Excel')
}

/* ---------- Cloud sync, with protection against overwriting your data ---------- */
let cloudSaveTimer=null,retryTimer=null,saving=false,resave=false,warnedFull=false,listenersOn=false;
function showSyncStatus(state){
  const map={loading:'Loading…',pending:'Unsaved changes…',saving:'Saving to cloud…',synced:'Synced to cloud',offline:'Not saved to cloud yet, retrying',paused:'Editing paused: could not load your cloud data',conflict:'Not saved: changed elsewhere',full:'Cloud storage full'};
  let d=document.getElementById('syncDot');if(d){d.className='sdot state-'+state;d.title=map[state]||''}
  document.body.dataset.sync=state
}
function lockEdits(type,info){lockState={type,info:info||{}};document.body.classList.add('locked');renderBanner();showSyncStatus(type==='error'?'paused':'conflict')}
function clearLock(){lockState=null;document.body.classList.remove('locked');renderBanner()}
function renderBanner(){
  let b=document.getElementById('safety');if(!b)return;
  if(!lockState){b.classList.remove('show');b.innerHTML='';return}
  let t=lockState.type,i=lockState.info,msg,btns;
  if(t==='error'){msg='⚠ Your cloud data could not be loaded, so editing is paused. This protects your projects from being overwritten. Nothing you do here will be saved to the cloud.';btns='<button type="button" class="btn" onclick="retryBoot()">Try again</button>'}
  else if(t==='conflict'){msg='⚠ Your dashboard was changed on another device or tab. Your latest changes in this tab have not been saved.';btns='<button type="button" class="btn" onclick="resolveLoadLatest()">Load the latest</button><button type="button" class="btn alt" onclick="exportData()">Download my copy</button><button type="button" class="btn alt" onclick="resolveOverwrite()">Overwrite with mine</button>'}
  else{msg=`⚠ This save would cut your projects from ${i.oldCount} down to ${i.newCount}. Nothing was saved.`;btns='<button type="button" class="btn" onclick="resolveLoadLatest()">Load the latest</button><button type="button" class="btn alt" onclick="exportData()">Download my copy</button><button type="button" class="btn alt" onclick="resolveOverwrite()">Save anyway</button>'}
  b.innerHTML=`<div class="msg">${msg}</div>${btns}`;b.classList.add('show')
}
function queueCloudSave(){
  if(lockState){showSyncStatus(lockState.type==='error'?'paused':'conflict');return}
  if(typeof window.cloudSave!=='function'){showSyncStatus('offline');return}
  if(cloudVersion===null){showSyncStatus('loading');return}
  showSyncStatus('pending');clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>{cloudSaveTimer=null;doCloudSave(false)},900)
}
async function doCloudSave(force){
  if(lockState&&!force)return;
  if(saving){resave=true;return}
  saving=true;showSyncStatus('saving');
  let blobs={},archStr=null,notesStr=null;
  try{if(archiveDirty){archStr=JSON.stringify(archive);blobs.archiveZ=await zipStr(archStr)}}catch(e){console.warn(e)}
  try{if(notesDirty){notesStr=JSON.stringify({notes,ideas});blobs.notesZ=await zipStr(notesStr)}}catch(e){console.warn(e)}
  let r;
  try{r=await window.cloudSave({projects,settings,workplan},blobs,cloudVersion,!!force)}catch(e){r={ok:false,reason:'error'}}
  saving=false;
  if(r.ok){
    cloudVersion=r.updatedAt;if(r.bytes)docBytes=r.bytes;
    if(blobs.archiveZ!==undefined){archiveZ=blobs.archiveZ;if(JSON.stringify(archive)===archStr)archiveDirty=false}
    if(blobs.notesZ!==undefined){notesZ=blobs.notesZ;if(JSON.stringify({notes,ideas})===notesStr)notesDirty=false}
    if(lockState)clearLock();
    showSyncStatus('synced');
    if(r.bytes>800000&&!warnedFull){warnedFull=true;toastMsg('Cloud storage is over 80% full. See Settings.')}
    if(resave){resave=false;queueCloudSave()}
  }else if(r.reason==='conflict')lockEdits('conflict');
  else if(r.reason==='shrink')lockEdits('shrink',r);
  else if(r.reason==='toolarge'){docBytes=r.bytes||docBytes;showSyncStatus('full');toastMsg('Cloud storage is full, so this was not saved. Free up space in Settings.')}
  else{showSyncStatus('offline');clearTimeout(retryTimer);retryTimer=setTimeout(queueCloudSave,15000)}
}
async function applyCloud(r){
  let d=r.data||{};if(!Array.isArray(d.projects))throw new Error('cloud data has no projects');
  let arch=[];if(r.archiveZ){arch=JSON.parse(await unzipStr(r.archiveZ));if(!Array.isArray(arch))throw new Error('bad archive')}
  let nd={notes:[],ideas:[]};if(r.notesZ){nd=JSON.parse(await unzipStr(r.notesZ));if(!nd||typeof nd!=='object')throw new Error('bad notes')}
  let before=JSON.stringify(d.projects)+JSON.stringify(d.settings||{})+JSON.stringify(d.workplan||null);
  projects=d.projects.map(migrate);
  if(d.settings&&typeof d.settings==='object')settings=d.settings;
  ensureSettings(settings);
  workplan=(d.workplan&&Array.isArray(d.workplan.sheets)&&d.workplan.sheets.length)?d.workplan:structuredClone(WP_SEED);
  notes=Array.isArray(nd.notes)?nd.notes:[];ideas=Array.isArray(nd.ideas)?nd.ideas:[];
  archive=arch;archiveZ=r.archiveZ||'';archiveDirty=false;notesZ=r.notesZ||'';notesDirty=false;cloudVersion=r.updatedAt||0;docBytes=r.bytes||0;
  localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));localStorage.setItem(WORKPLAN_KEY,JSON.stringify(workplan));
  if(archiveZ)localStorage.setItem(ARCHIVE_KEY,archiveZ);else localStorage.removeItem(ARCHIVE_KEY);
  if(notesZ)localStorage.setItem(NOTES_KEY,notesZ);else localStorage.removeItem(NOTES_KEY);
  return before!==JSON.stringify(projects)+JSON.stringify(settings)+JSON.stringify(workplan)
}
async function resolveLoadLatest(){
  await takeSnapshot('My changes before loading the latest','safety');
  let r=await window.cloudLoad();
  if(r.status!=='ok'){toastMsg('Still cannot reach the cloud. Try again in a moment.');return}
  try{await applyCloud(r)}catch(e){toastMsg('The cloud copy could not be read');return}
  clearLock();showSyncStatus('synced');applyZoom();render();toastMsg('Loaded the latest version')
}
async function resolveOverwrite(){
  if(!confirm('Replace the cloud copy with what is in this tab? The current cloud copy is saved on this device as a safety copy first.'))return;
  let r=await window.cloudLoad();
  if(r.status==='ok'){await takeSnapshot('Cloud copy before I overwrote it','safety',{projects:(r.data||{}).projects||[],settings:(r.data||{}).settings||settings,workplan:(r.data||{}).workplan||workplan,archiveZ:r.archiveZ||'',notesZ:r.notesZ||''});cloudVersion=r.updatedAt}
  else if(r.status==='empty')cloudVersion=0;
  else{toastMsg('Cannot reach the cloud right now');return}
  clearLock();archiveDirty=true;notesDirty=true;await doCloudSave(true)
}
async function checkRemote(){
  let typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#notesView,#ideasView');
  if(lockState||cloudVersion===null||saving||cloudSaveTimer!==null||archiveDirty||notesDirty||noteDirty||typing||drawerOpen()||typeof window.cloudLoad!=='function')return;
  let r=await window.cloudLoad();
  if(r.status==='ok'&&r.updatedAt>cloudVersion&&!saving&&cloudSaveTimer===null&&!drawerOpen()){
    try{await applyCloud(r);applyZoom();render();toastMsg('Updated with your latest changes from another device')}catch(e){console.warn(e)}
  }
}
async function retryBoot(){await boot()}
async function boot(){
  setView('home');showSyncStatus('loading');document.body.classList.add('locked');
  if(!listenersOn){listenersOn=true;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkRemote()});window.addEventListener('beforeunload',()=>{try{flushNote()}catch(_){}})}
  try{await Promise.race([window.__firebaseReady,new Promise(r=>setTimeout(r,8000))])}catch(_){}
  if(typeof window.cloudLoad!=='function'){await loadLocalArchive();await loadLocalNotes();render();lockEdits('error');return}
  let r=await window.cloudLoad();
  if(r.status==='ok'){
    let changed=false;
    try{changed=await applyCloud(r)}catch(e){console.warn(e);await loadLocalArchive();await loadLocalNotes();render();lockEdits('error');return}
    clearLock();showSyncStatus('synced');applyZoom();
    await autoSnapshot();
    migrateCompleted();migrateIdeas();
    if(changed)queueCloudSave()
  }else if(r.status==='empty'){
    cloudVersion=0;await loadLocalArchive();await loadLocalNotes();clearLock();migrateCompleted();migrateIdeas();queueCloudSave()
  }else{
    await loadLocalArchive();await loadLocalNotes();render();lockEdits('error');return
  }
  render()
}
boot();
</script></body></html>

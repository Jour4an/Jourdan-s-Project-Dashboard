<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>window.__firebaseReady=new Promise(function(res){window.__firebaseReadyResolve=res});</script><title>Jourdan's Project Dashboard</title><style>
:root{--ink:#172033;--muted:#657080;--line:#d7dee8;--page:#edf3f9;--native:#134a8e;--native2:#1d7be6;--gold:#ffc400;--red:#e5242f;--orange:#ff8a00;--accent:var(--native);--accent2:var(--native2);--dz-card-gap:9px;--dz-card-radius:16px;--dz-bucket-minh:500px;--dz-bucket-gap:20px;--dz-agg-card-minh:58px;--dz-agg-card-pad:8px;--dz-coming-card-minh:96px;--dz-coming-card-pad:10px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 10% 0,#fff,#edf3f9 50%,#e4ebf3);color:var(--ink);font-family:Calibri,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button,input,select,textarea,.ptab,.tab{transition:background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease}
.hidden{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#030507 0%,#07182a 50%,var(--native2) 130%);color:white;padding:18px 24px;box-shadow:0 8px 28px #07121f4d}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.top h1{font:700 27px Montserrat,"Segoe UI",sans-serif;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}
.primary{background:#73c6ff;color:#062e54}
.light{background:white;color:#26313e}
.ghost{background:#ffffff18;border:1px solid #ffffff44;color:white}
.danger{background:#fee4e2;color:#912018}
.small{font-size:12px;padding:6px 9px}
.zoom-group{display:flex;align-items:center;gap:2px;background:#ffffff18;border:1px solid #ffffff44;border-radius:9px;padding:3px}
.zoom-group button{background:transparent;border:0;color:white;font-weight:900;width:28px;height:28px;border-radius:6px;font-size:16px;line-height:1}.zoom-group button:hover{background:#ffffff22}.zoom-group span{font-size:11.5px;font-weight:800;min-width:36px;text-align:center;color:white}
.sync-status{font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;padding:4px 2px}
.sync-status:before{content:'';display:inline-block;width:8px;height:8px;border-radius:99px;background:currentColor}
.sync-status.state-loading,.sync-status.state-pending,.sync-status.state-saving{color:#ffb020}.sync-status.state-synced{color:#3bd671}.sync-status.state-offline,.sync-status.state-paused,.sync-status.state-conflict,.sync-status.state-full{color:#ff6b6b}
.view-toggle{display:flex;background:#ffffff18;border:1px solid #ffffff44;border-radius:9px;padding:3px;gap:2px}
.view-toggle button{border:0;background:transparent;color:#fff;font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:7px}
.view-toggle button.on{background:#fff;color:#07182a}
.count-pill{display:inline-block;min-width:18px;text-align:center;background:#ffffff33;border-radius:99px;padding:0 6px;margin-left:5px;font-size:11px}
/* safety banner */
.safety{display:none;margin:14px -24px -18px;padding:12px 24px;background:#b42318;color:#fff;font-weight:700;font-size:14px;align-items:center;gap:12px;flex-wrap:wrap}
.safety.show{display:flex}
.safety .msg{flex:1 1 320px;line-height:1.35}
.safety .btn{background:#fff;color:#7a1b12;padding:7px 12px}
.safety .btn.alt{background:#ffffff26;color:#fff;border:1px solid #ffffff66}
body.locked #zoomWrap,body.locked #newProjectBtn,body.locked .view-toggle,body.locked #archiveBtn{pointer-events:none;opacity:.45;filter:grayscale(.4)}
/* Coming Up / Upcoming sections */
.focus{margin:18px;border-radius:22px;background:linear-gradient(135deg,#050608,#3c2c00 53%,var(--gold) 128%);padding:18px;color:white;box-shadow:0 18px 40px #26313e24}
.focus-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.focus h2,.focus-head h2{font:700 13px Montserrat,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.3px;margin:0}
.focus-nav{display:flex;align-items:center;gap:8px}
.focus-nav button{width:26px;height:26px;font-size:13px;border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:8px}
.focus-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:11px;padding-bottom:16px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#ffffff4d transparent}
.focus-track::-webkit-scrollbar{height:6px}.focus-track::-webkit-scrollbar-track{background:transparent}.focus-track::-webkit-scrollbar-thumb{background:#ffffff4d;border-radius:99px}
.focus-card{flex:0 0 calc((100% - 44px)/5);scroll-snap-align:start;background:white;color:var(--ink);border-top:5px solid var(--gold);border-radius:14px;padding:var(--dz-coming-card-pad);min-height:var(--dz-coming-card-minh);box-shadow:0 8px 20px #0002;cursor:pointer}
.focus-card.st-overdue{border-top-color:var(--red)}
.focus-card.st-today{border-top-color:var(--orange)}
.focus-card .tag-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.focus-card .tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#7b5c00}
.focus-card .tag.overdue{color:#d92d20}.focus-card .tag.today{color:#e8590c}
.kind-badge{display:inline-block;background:var(--c);color:var(--tc,#fff);font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;border-radius:99px;padding:2px 8px;white-space:nowrap}
.focus-card h3{font:700 13px Montserrat,"Segoe UI",sans-serif;margin:5px 0 8px}
.focus-task{font-size:12px;font-weight:800;margin-bottom:6px}
.focus-date{display:inline-block;margin-top:2px;padding:3px 10px;border-radius:99px;background:#fff3c4;border:1px solid #f0cf6a;color:#111;font-size:12.5px;font-weight:800}
.focus-date.overdue{background:#fde8e8;border-color:#f1a3a3;color:#9b1c1c}
.focus-date.today{background:#ffe8cc;border-color:#ffb766;color:#7a3b00}
.focus-empty{flex:1;text-align:center;padding:24px;border:1px dashed #ffffff66;border-radius:12px}
.content-row-flex{display:flex;gap:var(--dz-bucket-gap);margin:0 18px 18px;flex-wrap:wrap}
.content-row-flex .focus{margin:0;flex:1 1 400px;min-width:0}
.social-agg,.ad-agg{background:linear-gradient(135deg,#050608,#0a2340 53%,var(--native2) 128%)}
.agg-compact{padding:18px}
.agg-compact .focus-head{margin-bottom:7px}
.agg-compact .focus-track{gap:8px;padding-bottom:12px}
.agg-compact .focus-card{min-height:var(--dz-agg-card-minh);padding:var(--dz-agg-card-pad)}
.agg-compact .focus-task{font-size:11.5px;margin-bottom:4px}
.agg-compact .focus-date{font-size:12px;padding:2px 9px}
.agg-sub{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.agg-platform-badge{display:inline-block;background:var(--c,#657181);color:#fff;font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:99px;white-space:nowrap}
.dm-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.dm{display:flex;flex-direction:column;border-radius:9px;padding:3px 9px;background:#fff3c4;border:1px solid #f0cf6a;color:#111;line-height:1.15}
.dm span{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.dm b{font-size:12.5px;font-weight:800}
.dm.overdue{background:#fde8e8;border-color:#f1a3a3;color:#9b1c1c}
.dm.today{background:#ffe8cc;border-color:#ffb766;color:#7a3b00}
.dm.run{background:#eef2f7;border-color:#d3dbe6;color:#334155}
/* board */
.board-wrap{padding:0 18px 25px;overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:var(--dz-bucket-gap);min-width:1150px}
.bucket{display:flex;flex-direction:column;padding:10px 10px 14px;border-radius:22px;min-height:var(--dz-bucket-minh);background:linear-gradient(145deg,#ffffff,#f5f8fc);border:1px solid #dde5ee;box-shadow:0 8px 22px #1723360d}
.bucket-head{display:flex;justify-content:space-between;align-items:center;padding:14px;color:white;border-radius:14px;margin-bottom:13px;font:700 13px Montserrat,"Segoe UI",sans-serif}
.bucket-head b{background:#ffffff28;border:1px solid #ffffff44;border-radius:99px;padding:4px 9px}
.bucket-body{position:relative;display:flex;flex-direction:column;gap:var(--dz-card-gap);min-height:430px;flex:1;border-radius:16px}
.bucket-body.over{outline:3px dashed var(--native2);border-radius:12px}
.empty{text-align:center;color:#8190a2;padding:14px}
.card-shell{--cardAccent:var(--native2);perspective:1200px;scroll-margin-top:120px}
.card-shell.drop-before{box-shadow:0 -3px 0 0 var(--native2)}.card-shell.drop-after{box-shadow:0 3px 0 0 var(--native2)}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.22,.8,.24,1)}
.card-shell.flipped .card-inner{transform:rotateY(180deg)}
.card-face,.card-back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card{background:linear-gradient(145deg,#ffffffef,#f8fbffdc);border:1.5px solid color-mix(in srgb,var(--cardAccent) 35%,white);border-radius:var(--dz-card-radius);overflow:hidden;box-shadow:0 7px 18px #17233614;cursor:pointer;transition:border-color .3s ease,box-shadow .3s ease}
.card:hover{border-color:var(--cardAccent);box-shadow:0 10px 25px #1723361c}
.card-title{padding:10px 12px;color:white;font:700 14px/1.2 Montserrat,"Segoe UI",sans-serif}
.meta{display:flex;gap:9px;align-items:center;padding:7px 11px;font-size:13px;font-weight:800;flex-wrap:wrap}
.meta span:not(:last-child):after{content:"•";margin-left:9px;color:#a5afbd}
.priority.Urgent{color:#c91536}.priority.High{color:#b95800}.priority.Normal{color:#134a8e}.priority.Low{color:#1c6d2c}
.next{margin:8px 10px 0;padding:9px;background:color-mix(in srgb,var(--cardAccent) 15%,white);border:1px solid color-mix(in srgb,var(--cardAccent) 35%,white);border-radius:11px;font-size:13px;font-weight:800;color:#111}
.next strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;color:#111}
.next-item-due{margin-top:7px;padding:7px 10px;background:linear-gradient(180deg,#fff9e0,#ffedb0);border:1px solid #f2d98a;border-radius:9px;font-size:12px;font-weight:700;color:#111}
.next-item-due .lbl{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;opacity:.7;margin-bottom:1px}
.dates{display:flex;gap:8px;margin:8px 10px}
.dl{flex:1 1 0;min-width:0;padding:8px 10px;background:linear-gradient(180deg,#fff4c8,#eeba3d);color:#111;border:1px solid #dfad2f;border-radius:11px;display:flex;flex-direction:column;gap:2px}
.dl-lbl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;line-height:1.15;color:#111;opacity:.75}
.dl-val{font-size:14px;font-weight:800;color:#111;line-height:1.2}
.dl.unset .dl-val{font-weight:700;opacity:.55}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 8px}
.mark{background:color-mix(in srgb,var(--cardAccent) 78%,#111);color:#fff;border:1.5px solid transparent;font-weight:800}
.mark:hover{background:color-mix(in srgb,var(--cardAccent) 88%,#000)}
.flip{background:color-mix(in srgb,var(--cardAccent) 18%,white);color:color-mix(in srgb,var(--cardAccent) 78%,#111);border:1.5px solid color-mix(in srgb,var(--cardAccent) 45%,white);font-weight:800}
.card-back{position:absolute;inset:0;transform:rotateY(180deg);color:#fff;padding:15px;border-radius:16px;overflow:auto;cursor:pointer;border:1.5px solid color-mix(in srgb,var(--cardAccent) 50%,white);box-shadow:0 8px 22px #1723361c}
.card-back h3{font:700 15px/1.2 Montserrat,"Segoe UI",sans-serif;margin:0 0 12px;color:#fff}
.back-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:#ffffffb8;margin-top:10px}.back-text{font-size:13px;line-height:1.35;margin-top:3px;color:#fff}
.health-dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:7px;vertical-align:middle;flex:none}
.health-dot.ok{background:#3bd671}.health-dot.soon{background:#ffb020}.health-dot.overdue{background:#ff4d4f}
.next-check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.next-check input{width:18px;height:18px;margin-top:2px;flex:none;cursor:pointer}
.next.all-done{color:#1c6d2c}
.next-src-tag{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--cardAccent) 30%,white);color:color-mix(in srgb,var(--cardAccent) 75%,#111);margin-right:6px;vertical-align:middle}
.next.completing .next-check span{text-decoration:line-through;opacity:.55}
.next.completing{transition:opacity .35s ease}.next.completing .next-check input{pointer-events:none}
.next.fading-out{opacity:0;transition:opacity .28s ease}
.next.fading-in{animation:nextFadeIn .32s ease}
@keyframes nextFadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.progress-mini{font-size:10.5px;font-weight:800;color:#657181;margin-top:7px}
/* drawers */
.overlay{display:block!important;visibility:hidden;opacity:0;pointer-events:none;position:fixed;inset:0;background:#11182788;z-index:40;transition:opacity .26s ease,visibility 0s linear .26s}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .26s ease}
.drawer{--accent:var(--native);--accent2:var(--native2);position:fixed;right:0;top:0;width:min(850px,98vw);height:100vh;background:white;z-index:50;overflow:auto;box-shadow:-12px 0 40px #11182740;visibility:hidden;transform:translate3d(100%,0,0);transition:transform .34s cubic-bezier(.22,.8,.24,1),visibility 0s linear .34s;will-change:transform}
.drawer.open{visibility:visible;transform:translate3d(0,0,0);transition:transform .34s cubic-bezier(.22,.8,.24,1)}
.drawer.notebook-mode{width:min(1150px,99vw)}
.drawer-head{position:sticky;top:0;z-index:3;background:linear-gradient(135deg,#050708,#0c1520 50%,var(--accent2) 128%);color:white;padding:16px 18px;display:flex;justify-content:space-between}
.drawer-head h2{margin:0}
.close{border:0;background:#ffffff20;color:white;border-radius:8px;font-size:20px;padding:5px 10px}
.project-tabs{position:sticky;top:61px;z-index:2;display:flex;gap:6px;padding:10px 18px;background:#f5f7fa;border-bottom:1px solid var(--line)}
.ptab{border:0;border-radius:8px;padding:9px 13px;background:#e6ebf1;color:#465162;font-weight:700}
.ptab.on,.summary div{background:var(--accent);color:white}
.form{padding:18px;animation:panelFade .18s ease-out}
@keyframes panelFade{from{opacity:.35}to{opacity:1}}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{text-align:center;padding:10px;border-radius:9px;font-weight:800}
.section{margin:18px 0 10px;background:color-mix(in srgb,var(--accent) 14%,white);color:color-mix(in srgb,var(--accent) 68%,#111);padding:9px 11px;border-radius:8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#4c5567}
.field input,.field select,.field textarea{border:1px solid #cfd5df;border-radius:8px;padding:9px;background:white}
.field textarea{min-height:78px;resize:vertical}
.channels{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.check-pill{display:flex;gap:7px;align-items:center;border:1px solid #d5d9e2;border-radius:8px;background:#fafbfc;padding:8px 9px;font-weight:700}
.checklist{display:flex;flex-direction:column;gap:9px}
.check-row{display:grid;grid-template-columns:20px 34px 1.5fr 170px 1.5fr 38px;gap:7px;align-items:center;padding:9px;border:1px solid #d5d9e2;border-radius:10px;background:#fafbfc}
.check-row.done .task-text{text-decoration:line-through;color:#7b8493}
.check-row input[type=checkbox]{width:20px;height:20px}
.check-row input{min-width:0;border:1px solid #ccd3de;border-radius:7px;padding:8px}
.check-row.drop-before{box-shadow:0 -3px 0 0 var(--native2)}.check-row.drop-after{box-shadow:0 3px 0 0 var(--native2)}
.check-row.linked-row{background:#f7f9fc}
.remove{border:0;background:#f7e7e8;color:#99404d;border-radius:7px;height:34px}
.remove.goto{background:#e7edf4;color:#134a8e}
.task-handle{cursor:grab;color:#98a2b3;font-size:12px;user-select:none;display:flex;align-items:center;justify-content:center}
.task-text-cell{display:flex;align-items:center;gap:6px;min-width:0}
.task-text-cell .task-text{flex:1;min-width:0}
.task-tag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 7px;border-radius:99px;flex:none;white-space:nowrap}
.task-tag.social{background:#dbeafe;color:#134a8e}.task-tag.ad{background:#fff1cf;color:#8a5b00}
.task-text.linked{background:#eef1f5;color:#5b6472;cursor:not-allowed}
.notebook-wrap{padding:0 24px 42px;background:#edf2f7;min-height:calc(100vh - 130px);animation:panelFade .18s ease-out}
.notebook-paper{max-width:950px;margin:auto;background:white;border:1px solid #dde3e9;border-top:5px solid var(--accent);border-radius:16px;box-shadow:0 15px 38px #1723361a;overflow:hidden}
.note-toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:#f7f9fb;border-bottom:1px solid #e0e5eb}
.note-toolbar button,.note-toolbar select,.note-toolbar input{border:1px solid #d0d6de;background:white;border-radius:7px;padding:7px 9px}
.note-toolbar button{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#3a4454}
.note-toolbar button:hover{background:#eef2f7}.note-toolbar select{height:34px}.note-toolbar input[type=color]{width:34px;height:34px;padding:2px}
.note-sep{width:1px;align-self:stretch;background:#dfe4ea;margin:2px 3px}
.notebook-title{padding:26px 42px 0;font:700 25px Montserrat,"Segoe UI",sans-serif}
.editor{min-height:600px;padding:22px 42px 60px;outline:none;font-size:16px;line-height:1.65}
.editor blockquote{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,white);padding:12px 16px;margin-left:0}
.drawer-actions{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.drawer-actions .grow{flex:1}
.btn.complete{background:color-mix(in srgb,var(--accent) 78%,#111);color:#fff}
.btn.complete:hover{background:color-mix(in srgb,var(--accent) 90%,#000)}
.toast{position:fixed;z-index:400;bottom:22px;left:50%;transform:translate(-50%,70px);opacity:0;background:#17212c;color:white;padding:10px 15px;border-radius:9px;transition:.2s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* plans (social + advertising) */
.plan-wrap{padding:2px 1px 6px}
.plan-intro{font-size:13px;color:var(--muted);margin:-2px 0 14px;line-height:1.5}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.psum{display:flex;gap:7px;flex-wrap:wrap}
.psum span{font-size:12px;font-weight:800;border-radius:99px;padding:5px 12px;background:color-mix(in srgb,var(--accent) 14%,white);color:color-mix(in srgb,var(--accent) 72%,#111)}
.pbtns{display:flex;gap:7px}
.plan-add{background:var(--accent);color:white;border:0}
.plan-sort{background:#eef1f5;color:#334155;border:0}
.plan-list{display:flex;flex-direction:column;gap:12px}
.plan-empty{text-align:center;color:#8190a2;padding:26px 10px;border:1px dashed #d9dfe8;border-radius:12px}
.pcard{--pc:var(--accent);border:1px solid #dfe5ee;border-left:6px solid var(--pc);border-radius:14px;background:#fff;box-shadow:0 2px 8px #1723360d;transition:box-shadow .18s ease}
.pcard.collapsed:hover{box-shadow:0 5px 16px #17233620}
.pcard.open{box-shadow:0 10px 26px #17233624}
.pcard.drop-before{box-shadow:0 -3px 0 0 var(--native2)}.pcard.drop-after{box-shadow:0 3px 0 0 var(--native2)}
.pcard-head{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.pcard-main{flex:1;min-width:0}
.pcard-title{display:flex;gap:9px;align-items:center;font-weight:800;font-size:15px;color:#172033}
.pcard-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

function ensureSettings(s){

  if(!Array.isArray(s.buckets)||!s.buckets.length){s.buckets=structuredClone(DEFAULT_BUCKETS);changed=true}
  if(!Array.isArray(s.projectFields)||!s.projectFields.length){s.projectFields=structuredClone([...DEFAULT_CORE_FIELDS,...DEFAULT_PROJECT_FIELDS]);changed=true}

  let missing=DEFAULT_CORE_FIELDS.filter(f=>!have.has(f.key)).map(f=>structuredClone(f));
  if(missing.length){s.projectFields=[...missing,...s.projectFields];changed=true}
  s.projectFields.forEach(f=>{let def=DEFAULT_CORE_FIELDS.find(c=>c.key===f.key);if(def){if(!f.core||f.type!==def.type||!!f.locked!==!!def.locked){f.core=true;f.type=def.type;f.locked=!!def.locked;changed=true}}});

    let rec=s.projectFields.find(f=>f.key==='recurrence');

    s.migrated.repeatRulesV25=true;changed=true
  }
  return changed
}

const DUE_LABEL={overdue:'Overdue',today:'Due Today',week:'Due this week',later:'Coming up'};
function dueState(v){let d=days(v);if(d<0)return'overdue';if(d===0)return'today';if(d<=daysLeftInWeek())return'week';return'later'}

/* ---------- Repeat helpers ---------- */
function nthWeekdayOfMonth(y,m,dow,n){
  if(n===5){let d=new Date(y,m+1,0);while(d.getDay()!==dow)d.setDate(d.getDate()-1);return d}
  let d=new Date(y,m,1);while(d.getDay()!==dow)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d.getMonth()===m?d:null
}
function nextRuleDate(after,rule){
  if(!after||!rule||!Array.isArray(rule.nth)||!rule.nth.length)return'';
  let a=new Date(after+'T00:00:00');
  for(let k=0;k<30;k++){
    let base=new Date(a.getFullYear(),a.getMonth()+k,1),c=[];
    rule.nth.forEach(n=>{let d=nthWeekdayOfMonth(base.getFullYear(),base.getMonth(),+rule.dow,+n);if(d)c.push(isoOf(d))});
    c.sort();
    let hit=c.find(x=>x>after);
    if(hit)return hit
  }
  return''
}
function ruleFor(p){let r=p&&p.recurrence;if(RECUR_PRESETS[r])return RECUR_PRESETS[r];if(r===RECUR_CUSTOM&&p.repeatRule&&Array.isArray(p.repeatRule.nth)&&p.repeatRule.nth.length)return p.repeatRule;return null}
function nextRecurringDate(v,r){return r==='Weekly'?addDays(v,7):r==='Every 2 Weeks'?addDays(v,14):r==='Monthly'?addMonths(v,1):r==='Every 3 Months'?addMonths(v,3):r==='Yearly'?addMonths(v,12):v}
function nextOccurrence(p,from){let rule=ruleFor(p);return rule?nextRuleDate(from,rule):nextRecurringDate(from,p.recurrence)}
function isRepeating(p){return !!(p.recurrence&&p.recurrence!=='None')}

/* ---------- Normalizers / migration ---------- */
function normalizeSocialItem(x){if(!Array.isArray(x.platforms))x.platforms=x.platform?[x.platform]:[];delete x.platform;x.platforms=x.platforms.filter(pl=>pl!=='Website');x.title=x.title||'';x.date=x.date||'';x.assetPhoto=!!x.assetPhoto;x.assetCopy=!!x.assetCopy;x.assetGraphic=!!x.assetGraphic;x.assetVideo=!!x.assetVideo;x.idea=x.idea||'';x.timing=x.timing||'';x.notes=x.notes||'';x.status=x.status||'Idea';return x}
function adRunDate(ad){if(ad.platform==='Newspaper'&&ad.bookingDeadline){return ad.runDate||nextWednesday(ad.bookingDeadline)}return''}
function normalizeAdItem(x){x.title=x.title||'';x.idea=x.idea||'';x.bookingDeadline=x.bookingDeadline||'';x.timing=x.timing||'';x.notes=x.notes||'';x.status=x.status||'Idea';x.runDate=x.runDate||'';if(x.platform==='News Flash'||x.platform==='News & Notices')x.platform='Website - News';if(x.platform==='Bulletin Ad')x.platform='Newspaper';if(typeof x.titleEdited!=='boolean')x.titleEdited=!!(x.title.trim()&&x.title!==x.platform);if(x.platform==='Newspaper'&&x.bookingDeadline&&!x.runDate)x.runDate=nextWednesday(x.bookingDeadline);delete x.assetPhoto;delete x.assetCopy;delete x.assetGraphic;delete x.assetVideo;return x}
function migrate(p){if(!Array.isArray(p.channels))p.channels=(p.channels||'').split(',').map(x=>x.trim()).filter(Boolean);if(!Array.isArray(p.tasks)){p.tasks=[];if(p.nextAction)p.tasks.push({id:crypto.randomUUID(),text:p.nextAction,date:p.nextActionDate||'',notes:'',complete:false})}p.notebook=typeof p.notebook==='string'?p.notebook:'';p.recurrence=p.recurrence||'None';p.department=p.department||'';p.deadline=p.deadline||'';p.campaignLaunch=p.campaignLaunch||'';if(!Array.isArray(p.socialPosts))p.socialPosts=[];p.socialPosts=p.socialPosts.map(normalizeSocialItem);if(!Array.isArray(p.advertisingPosts))p.advertisingPosts=[];p.advertisingPosts=p.advertisingPosts.map(normalizeAdItem);return p}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(const k of OLD){raw=localStorage.getItem(k);if(raw)break}let x=raw?JSON.parse(raw):[sample];return(Array.isArray(x)?x:x.projects).map(migrate)}catch{return[sample]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(projects));queueCloudSave()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nextTask(p){return(p.tasks||[]).filter(t=>!t.complete).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))[0]||null}
function bucketNames(){return settings.buckets.map(b=>b.name)}
function bucketColor(b){let x=settings.buckets.find(y=>y.name===b);return x?x.color:'#134a8e'}
function headerGradient(hex){return`linear-gradient(140deg,#050708,color-mix(in srgb, ${hex} 42%, black) 44%, ${hex} 122%)`}
function backGradient(hex){return`linear-gradient(140deg,#050708 0%,#111 40%,${hex} 125%)`}
function filtered(){return projects}

/* The project's own dates (Launch Date + Campaign Launch Date) */
function projectDates(p){let a=[];[['deadline','launch'],['campaignLaunch','campaign']].forEach(([k,kind])=>{if(p[k]){let f=coreField(k);if(!f||f.visible!==false){if(k==='deadline'&&isRepeating(p))a.push({date:p[k],text:'Repeats · '+p.recurrence,kind:'repeat'});else a.push({date:p[k],text:fieldLabel(k,k),kind})}}});return a}
/* The soonest thing that needs attention on a project: next open checklist item or either launch date */
function dueInfo(p){let c=[],t=nextTask(p);if(t&&t.date)c.push({date:t.date,text:t.text,kind:'task'});projectDates(p).forEach(x=>c.push(x));c.sort((a,b)=>a.date.localeCompare(b.date));return c[0]||null}
function healthStatus(p){let t=nextTask(p),d=Math.min(days(t?.date),days(p.deadline),days(p.campaignLaunch));if(d<0)return'overdue';if(d<=3)return'soon';return'ok'}
function checklistCounts(p){let list=p.tasks||[];return{total:list.length,done:list.filter(x=>x.complete).length}}
function syncLinkedStatusOnComplete(p,t){if(t.linkedType==='social'){let sp=(p.socialPosts||[]).find(s=>s.id===t.linkedId);if(sp)sp.status='Posted'}else if(t.linkedType==='ad'){let ad=(p.advertisingPosts||[]).find(a=>a.id===t.linkedId);if(ad)ad.status='Ran'}}

/* ---------- Board / cards ---------- */
function checkNextFromCard(id,taskId,checked){let p=projects.find(x=>x.id===id);if(!p)return;let t=(p.tasks||[]).find(x=>x.id===taskId);if(!t)return;if(checked){let block=document.querySelector(`[data-card-next="${id}"]`);if(block){block.classList.add('completing');let cb=block.querySelector('input[type=checkbox]');if(cb)cb.disabled=true}t.complete=true;syncLinkedStatusOnComplete(p,t);persist();setTimeout(()=>{if(block)block.classList.add('fading-out');setTimeout(()=>{render()},280)},380)}else{t.complete=false;persist();render()}}
function linkedSourceLabel(p,t){if(!t||!t.linkedType)return'';if(t.linkedType==='social')return'Social Post';let ad=(p.advertisingPosts||[]).find(a=>a.id===t.linkedId);return ad&&ad.platform?ad.platform+' Ad':'Ad'}
function checklistBody(p,t,cnt){if(t){let srcLabel=linkedSourceLabel(p,t),srcTag=srcLabel?`<span class="next-src-tag">${esc(srcLabel)}</span>`:'';return`<div class="next-check"><input type="checkbox" onclick="event.stopPropagation()" onchange="checkNextFromCard('${p.id}','${t.id}',this.checked)"><span><strong>Next checklist item</strong>${srcTag}${esc(t.text)}</span></div><div class="next-item-due"><span class="lbl">Next item due</span>${t.date?dateLabel(t.date):'Not set'}</div><div class="progress-mini">${cnt.done}/${cnt.total} checklist items complete</div>`}return`<div class="all-done"><strong>Next checklist item</strong>All checklist items complete</div><div class="progress-mini">${cnt.done}/${cnt.total} checklist items complete</div>`}
function dateBlocks(p){
  return['deadline','campaignLaunch'].map(k=>{
    let f=coreField(k);if(!f||f.visible===false)return'';
    return`<div class="dl ${p[k]?'':'unset'}"><span class="dl-lbl">${esc(f.label)}</span><span class="dl-val">${dateLabel(p[k])}</span></div>`
  }).join('')
}
function card(p){let t=nextTask(p),hs=healthStatus(p),accent=bucketColor(p.bucket),cnt=checklistCounts(p),nextBlock=cnt.total>0?`<div class="next ${t?'':'all-done'} fading-in" data-card-next="${p.id}">${checklistBody(p,t,cnt)}</div>`:'',dates=dateBlocks(p);return`<div class="card-shell" data-card="${p.id}" data-b="${esc(p.bucket)}" style="--cardAccent:${accent}" draggable="true" ondragstart="dragged='${p.id}'" ondragover="dragOverCard(event)" ondragleave="dragLeaveCard(event)" ondrop="dropOnCard(event,'${p.id}',this.dataset.b)"><div class="card-inner"><article class="card card-face" onclick="openProject('${p.id}')"><div class="card-title" style="background:${headerGradient(accent)}"><span class="health-dot ${hs}" title="${hs==='overdue'?'Overdue':hs==='soon'?'Due soon':'On track'}"></span>${esc(p.project||'Untitled Project')}</div><div class="meta"><span>${esc(p.workType||'Project')}</span><span>${esc(p.status||'Not Started')}</span><span class="priority ${esc(p.priority)}">${esc(p.priority||'Normal')}</span></div>${nextBlock}${dates?`<div class="dates">${dates}</div>`:''}<div class="foot"><button class="btn small flip" onclick="event.stopPropagation();flipCard('${p.id}')">Flip Card</button><button class="btn small mark" onclick="event.stopPropagation();complete('${p.id}')">Mark Complete</button></div></article><section class="card-back" onclick="flipCard('${p.id}')" style="background:${backGradient(accent)}">${cardBackContent(p)}</section></div></div>`}
function flipCard(id){document.querySelector(`[data-card="${id}"]`)?.classList.toggle('flipped')}
function emptyMessage(b){return`All caught up here. Nothing in ${esc(b)} right now.`}
function render(){
  let open=filtered().filter(p=>p.status!=='Complete');
  board.innerHTML=bucketNames().map(b=>{let rows=open.filter(p=>p.bucket===b).sort((a,z)=>(a.order||999)-(z.order||999)),accent=bucketColor(b);return`<section class="bucket" data-b="${esc(b)}"><div class="bucket-head" style="background:${headerGradient(accent)}"><span>${esc(b.toUpperCase())}</span><b>${rows.length}</b></div><div class="bucket-body" data-b="${esc(b)}" style="background:color-mix(in srgb, ${accent} 5%, white)" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,this.dataset.b)">${rows.map(card).join('')||`<div class="empty">${emptyMessage(b)}</div>`}</div></section>`}).join('');
  focusItems=open.filter(p=>{let i=dueInfo(p);return p.priority==='Urgent'||(i&&days(i.date)<=7)}).sort((a,b)=>{let x=dueInfo(a),y=dueInfo(b);return(x?x.date:'9999').localeCompare(y?y.date:'9999')});
  if(focusIndex*5>=focusItems.length)focusIndex=0;
  renderFocus();renderSocialAgg();renderAdAgg();
  archiveCount.textContent=archive.length;
  if(view==='calendar')renderCalendar()
}
function kindBadge(kind){let c=CH[kind];if(!c)return'';let label=kind==='launch'?fieldLabel('deadline','Launch Date'):kind==='campaign'?fieldLabel('campaignLaunch','Campaign Launch Date'):kind==='task'?'Checklist':c.label;return`<span class="kind-badge" style="--c:${c.color};--tc:${c.tc}">${c.icon} ${esc(label)}</span>`}
function renderFocus(){
  focusPage.textContent=focusItems.length?`${focusItems.length} items`:'';
  focusTrack.innerHTML=focusItems.length?focusItems.map(p=>{
    let i=dueInfo(p),st=i?dueState(i.date):'later',t=nextTask(p);
    return`<article class="focus-card st-${st}" onclick="openProject('${p.id}')"><div class="tag-row"><span class="tag ${st}">${DUE_LABEL[st]}</span>${i?kindBadge(i.kind):''}</div><h3>${esc(p.project)}</h3><div class="focus-task">${esc(i?i.text:(t?t.text:'Marked urgent'))}</div><div class="focus-date ${st}">${i?dateLabel(i.date):'No date set'}</div></article>`
  }).join(''):'<div class="focus-empty">Nothing needs your immediate attention.</div>'
}
function focusNext(){focusTrack.scrollBy({left:Math.max(260,focusTrack.clientWidth*.82),behavior:'smooth'})}
function focusPrev(){focusTrack.scrollBy({left:-Math.max(260,focusTrack.clientWidth*.82),behavior:'smooth'})}
function scrollTrack(el,dir){el.scrollBy({left:dir*Math.max(260,el.clientWidth*.82),behavior:'smooth'})}
function allSocialUpcoming(){let items=[];projects.forEach(p=>{(p.socialPosts||[]).filter(isPlanItemKept).forEach(sp=>{if(sp.status==='Posted')return;if(sp.date&&days(sp.date)<=14)items.push({project:p,sp})})});items.sort((a,b)=>a.sp.date.localeCompare(b.sp.date));return items}
function allAdsUpcoming(){let items=[];projects.forEach(p=>{(p.advertisingPosts||[]).filter(isPlanItemKept).forEach(ad=>{if(ad.status==='Ran')return;if(ad.bookingDeadline&&days(ad.bookingDeadline)<=14)items.push({project:p,ad})})});items.sort((a,b)=>a.ad.bookingDeadline.localeCompare(b.ad.bookingDeadline));return items}
function renderSocialAgg(){
  let items=allSocialUpcoming();socialAggPage.textContent=items.length?`${items.length} items`:'';
  socialAggTrack.innerHTML=items.length?items.map(it=>{
    let st=dueState(it.sp.date),chanBadges=it.sp.platforms.length?it.sp.platforms.map(pl=>`<span class="agg-platform-badge" style="--c:${CH.social.color}">${esc(pl)}</span>`).join(''):`<span class="agg-platform-badge" style="--c:#94a3b8">No channel set</span>`;
    return`<article class="focus-card st-${st}" onclick="openProject('${it.project.id}')"><div class="tag-row"><span class="tag ${st}">${DUE_LABEL[st]}</span></div><h3>${esc(it.project.project)}</h3><div class="focus-task">${esc(it.sp.title||(it.sp.idea||'Untitled post').slice(0,40))}</div><div class="focus-date ${st}">${dateLabel(it.sp.date)}</div><div class="agg-sub">${chanBadges}</div></article>`
  }).join(''):'<div class="focus-empty">Nothing on the socials calendar for the next two weeks.</div>'
}
function renderAdAgg(){
  let items=allAdsUpcoming();adAggPage.textContent=items.length?`${items.length} items`:'';
  adAggTrack.innerHTML=items.length?items.map(it=>{
    let ad=it.ad,st=dueState(ad.bookingDeadline),rd=adRunDate(ad),isNews=ad.platform==='Newspaper',clr=adPlatformColor(ad.platform);
    return`<article class="focus-card st-${st}" onclick="openProject('${it.project.id}')"><div class="tag-row"><span class="tag ${st}">${DUE_LABEL[st]}</span><span class="kind-badge" style="--c:${clr};--tc:#fff">${esc(ad.platform||'Ad')}</span></div><h3>${esc(it.project.project)}</h3><div class="focus-task">${esc(ad.title||(ad.idea||'Untitled ad').slice(0,40))}</div><div class="dm-row"><div class="dm ${st}"><span>${isNews?'Submission deadline':'Deadline'}</span><b>${dateLabel(ad.bookingDeadline)}</b></div>${rd?`<div class="dm run"><span>Run date</span><b>${dateLabel(rd)}</b></div>`:''}</div></article>`
  }).join(''):'<div class="focus-empty">Nothing on the advertising calendar for the next two weeks.</div>'
}

/* ---------- Date control (text field + calendar popup) ---------- */
const DATE_PLACEHOLDER='dd-mm-yyyy';
function toDisp(iso){return validISO(iso)?iso.slice(8,10)+'-'+iso.slice(5,7)+'-'+iso.slice(0,4):''}
function parseDisp(s){
  s=(s||'').trim();
  if(validISO(s))return s;
  let m=s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{4})$/);
  if(!m)return null;
  let iso=m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return validISO(iso)?iso:null
}
/* opts: {name, value, cb, dow, title, readonly}. cb is JS run with the new ISO date in variable v. */
function dateInput(o){
  let v=o.value||'';
  return`<div class="dt${o.readonly?' ro':''}" data-cb="${esc(o.cb||'')}" data-dow="${o.dow==null?'':o.dow}"${o.title?` title="${esc(o.title)}"`:''}><input type="text" class="dt-text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="${DATE_PLACEHOLDER}" value="${toDisp(v)}"${o.readonly?' readonly':''} oninput="dtType(this)" onblur="dtBlur(this)" onclick="dtOpen(this)" onkeydown="dtKey(event)"><input type="hidden" class="dt-val"${o.name?` name="${o.name}"`:''} value="${esc(v)}"><button type="button" class="dt-pick" tabindex="-1" aria-label="Open calendar"${o.readonly?' disabled':''} onclick="dtOpen(this)">📅</button></div>`
}
function dtCommit(wrap,iso){
  let dow=wrap.dataset.dow;
  if(iso&&dow!==''&&parseISO(iso).getDay()!==+dow){toastMsg('Please pick a '+DOW_NAMES[+dow]);wrap.classList.add('invalid');return false}
  wrap.classList.remove('invalid');
  let hid=wrap.querySelector('.dt-val');
  if(hid.value===iso)return true;
  hid.value=iso;
  let cb=wrap.dataset.cb;
  if(cb){try{new Function('v',cb)(iso)}catch(e){console.error(e)}}
  return true
}
function dtType(el){
  let wrap=el.closest('.dt'),raw=el.value;
  closeDtPop();
  if(!validISO(raw)){
    let d=raw.replace(/\D/g,'').slice(0,8);
    raw=d.slice(0,2)+(d.length>2?'-'+d.slice(2,4):'')+(d.length>4?'-'+d.slice(4):'');
    el.value=raw
  }
  wrap.classList.remove('invalid');
  if(raw===''){dtCommit(wrap,'');return}
  if(raw.length===10){let iso=parseDisp(raw);if(iso)dtCommit(wrap,iso);else wrap.classList.add('invalid')}
}
function dtBlur(el){
  let wrap=el.closest('.dt'),hid=wrap.querySelector('.dt-val'),raw=el.value.trim();
  if(raw===''){if(hid.value!=='')dtCommit(wrap,'');wrap.classList.remove('invalid');return}
  let iso=parseDisp(raw);
  if(iso&&dtCommit(wrap,iso)){el.value=toDisp(iso)}
  else{el.value=toDisp(hid.value);wrap.classList.add('invalid');setTimeout(()=>wrap.classList.remove('invalid'),1300)}
}
function dtKey(e){if(e.key==='Escape')closeDtPop();if(e.key==='ArrowDown'&&e.altKey)dtOpen(e.target)}
let dtPopEl=null,dtCur=null,dtView=null;
function closeDtPop(){if(dtPopEl)dtPopEl.style.display='none';dtCur=null}
function dtOpen(el){
  let wrap=el.closest('.dt');
  if(wrap.classList.contains('ro'))return;
  if(dtPopEl&&dtPopEl.style.display==='block'&&dtCur===wrap&&el.classList.contains('dt-pick')){closeDtPop();return}
  dtCur=wrap;
  let base=wrap.querySelector('.dt-val').value||todayISO(),b=parseISO(base);
  dtView={y:b.getFullYear(),m:b.getMonth()};
  buildDtPop();positionDtPop()
}
function buildDtPop(){
  if(!dtPopEl){dtPopEl=document.createElement('div');dtPopEl.className='dtpop';dtPopEl.addEventListener('mousedown',e=>e.preventDefault());document.body.appendChild(dtPopEl)}
  let{y,m}=dtView,dow=dtCur.dataset.dow,sel=dtCur.querySelector('.dt-val').value,today=todayISO(),first=new Date(y,m,1),cells='';
  for(let i=0;i<42;i++){
    let d=new Date(y,m,1-first.getDay()+i),iso=isoOf(d),ok=dow===''||d.getDay()===+dow;
    cells+=`<button type="button" class="dtp-day${d.getMonth()!==m?' out':''}${iso===sel?' sel':''}${iso===today?' today':''}"${ok?` onclick="dtPickDate('${iso}')"`:' disabled'}>${d.getDate()}</button>`
  }
  let hdr=['S','M','T','W','T','F','S'].map((x,i)=>`<span${dow!==''&&+dow===i?' class="ok"':''}>${x}</span>`).join('');
  dtPopEl.innerHTML=`<div class="dtp-head"><button type="button" onclick="dtNav(-1)">‹</button><b>${MONTH_NAMES[m]} ${y}</b><button type="button" onclick="dtNav(1)">›</button></div><div class="dtp-dow">${hdr}</div><div class="dtp-grid">${cells}</div><div class="dtp-foot"><button type="button" onclick="dtToday()">Today</button><span>${dow!==''?DOW_NAMES[+dow]+'s only':''}</span><button type="button" onclick="dtClear()">Clear</button></div>`;
  dtPopEl.style.display='block'
}
function positionDtPop(){
  if(!dtCur||!dtPopEl)return;
  let r=dtCur.getBoundingClientRect(),w=272,h=dtPopEl.offsetHeight||330,left=Math.max(8,Math.min(r.left,window.innerWidth-w-8)),top=r.bottom+4;
  if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-4);
  dtPopEl.style.left=left+'px';dtPopEl.style.top=top+'px'
}
function dtNav(n){dtView.m+=n;if(dtView.m<0){dtView.m=11;dtView.y--}if(dtView.m>11){dtView.m=0;dtView.y++}buildDtPop()}
function dtPickDate(iso){
  if(!dtCur)return;
  let wrap=dtCur;
  if(dtCommit(wrap,iso)){wrap.querySelector('.dt-text').value=toDisp(iso);closeDtPop()}
}
function dtToday(){
  if(!dtCur)return;
  let dow=dtCur.dataset.dow,t=todayISO();
  dtPickDate(dow===''?t:nextDow(t,+dow))
}
function dtClear(){if(!dtCur)return;let wrap=dtCur;dtCommit(wrap,'');wrap.querySelector('.dt-text').value='';closeDtPop()}
document.addEventListener('mousedown',e=>{if(dtPopEl&&dtPopEl.style.display==='block'&&!dtPopEl.contains(e.target)&&!(dtCur&&dtCur.contains(e.target)))closeDtPop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDtPop();closeDayPanel();closeArchive()}});
window.addEventListener('scroll',e=>{if(dtPopEl&&dtPopEl.style.display==='block'&&!dtPopEl.contains(e.target))closeDtPop()},true);
window.addEventListener('resize',closeDtPop);

/* ---------- Project form ---------- */
function field(n,l,v='',type='text',full=false){return`<div class="field ${full?'full':''}"><label>${esc(l)}</label><input name="${n}" type="${type}" value="${esc(v)}"></div>`}
function dateField(n,l,v,full=false){return`<div class="field ${full?'full':''}"><label>${esc(l)}</label>${dateInput({name:n,value:v})}</div>`}
function selectField(n,l,v,o,blank=false,attrs=''){let ph=typeof blank==='string'?blank:(blank?'Select a bucket':'');if(v&&!o.includes(v))o=[v,...o];return`<div class="field"><label>${esc(l)}</label><select name="${n}"${attrs}>${ph?`<option value="">${ph}</option>`:''}${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function area(n,l,v=''){return`<div class="field full"><label>${esc(l)}</label><textarea name="${n}">${esc(v)}</textarea></div>`}
function channelHTML(s=[],opts=channelOptions,label='Channels'){return`<div class="field full"><label>${esc(label)}</label><div class="channels">${opts.map(c=>`<label class="check-pill"><input type="checkbox" name="channels" value="${esc(c)}" ${s.includes(c)?'checked':''}>${esc(c)}</label>`).join('')}</div></div>`}
function recurrenceExtras(p){
  let r=p.repeatRule&&Array.isArray(p.repeatRule.nth)?p.repeatRule:{dow:1,nth:[2,4]};
  let nths=[[1,'1st'],[2,'2nd'],[3,'3rd'],[4,'4th'],[5,'Last']];

function cardBackContent(p){let title=`<h3>${esc(p.project||'Untitled Project')}</h3>`,fields=settings.projectFields.filter(f=>f.onBack&&f.visible!==false).map(f=>{let val=esc(backValueText(f,p));return`<div class="back-label">${esc(f.label)}</div><div class="back-text">${val}</div>`}).join('');return title+(fields||'<div class="back-label">No back-of-card fields selected</div><div class="back-text">Choose fields to show here in Settings.</div>')}

function complete(id){
  let p=projects.find(x=>x.id===id);if(!p)return;
  let rep=isRepeating(p);
  archiveProject(p);
  if(rep){
    let clone=structuredClone(p),rule=ruleFor(p),shift;
    clone.id=crypto.randomUUID();clone.status='Not Started';clone.dateCompleted='';delete clone.archivedAt;
    clone.order=Math.max(0,...projects.filter(x=>x.bucket===clone.bucket).map(x=>+x.order||0))+1;
    if(rule){
      let anchor=p.deadline||(p.tasks||[]).map(t=>t.date).filter(Boolean).sort()[0]||'',today=todayISO(),from=(anchor&&anchor>today)?anchor:today;
      let next=nextRuleDate(from,rule),delta=(anchor&&next)?daysBetween(anchor,next):0;
      shift=d=>d?addDays(d,delta):d;
      clone.deadline=p.deadline?shift(p.deadline):next
    }else{
      shift=d=>d?nextRecurringDate(d,p.recurrence):d;
      clone.deadline=shift(p.deadline)
    }
    clone.campaignLaunch=shift(p.campaignLaunch);
    clone.tasks=(clone.tasks||[]).map(t=>({...t,id:crypto.randomUUID(),complete:false,date:shift(t.date)}));
    clone.socialPosts=(clone.socialPosts||[]).map(s=>({...s,date:shift(s.date),status:s.status==='Posted'?'Planned':s.status}));
    clone.advertisingPosts=(clone.advertisingPosts||[]).map(a=>{let b={...a,bookingDeadline:shift(a.bookingDeadline),status:(a.status==='Ran'||a.status==='Booked')?'Planned':a.status};b.runDate=(b.platform==='Newspaper'&&b.bookingDeadline)?nextWednesday(b.bookingDeadline):'';return b});
    projects.push(clone)
  }
  if(currentId===id)closeDrawer();
  projects=projects.filter(x=>x.id!==id);persist();render();toastMsg(rep?'Completed — next occurrence created':'Completed and moved to the Archive')
}

/* ---------- Compression (keeps the Archive small) ---------- */
async function zipStr(s){
  if(typeof CompressionStream==='undefined')return'raw:'+s;
  const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();
  w.write(new TextEncoder().encode(s));w.close();
  const bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin='';
  for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return'gz:'+btoa(bin)
}
async function unzipStr(z){
  if(!z)return'';
  if(z.startsWith('raw:'))return z.slice(4);
  const bin=atob(z.slice(3)),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(bytes);w.close();
  return await new Response(ds.readable).text()
}

/* ---------- Safety copies (kept on this device) ---------- */
function makeIdbStore(){
  const DB='jpdSafety',ST='snaps';
  const open=()=>new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('no idb'));const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const run=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction(ST,mode),q=fn(t.objectStore(ST));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
  return{put:rec=>run('readwrite',s=>s.put(rec)),list:()=>run('readonly',s=>s.getAll()),del:id=>run('readwrite',s=>s.delete(id))}
}
let snapStore=makeIdbStore();
async function takeSnapshot(label,kind,src){
  try{
    let s=src||{projects,settings,archiveZ:await zipStr(JSON.stringify(archive))};
    await snapStore.put({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),ts:Date.now(),day:todayISO(),kind:kind||'manual',label,data:JSON.stringify({projects:s.projects,settings:s.settings}),archiveZ:s.archiveZ||'',count:(s.projects||[]).length});
    let all=(await snapStore.list()).sort((a,b)=>b.ts-a.ts);
    for(const old of all.slice(20))await snapStore.del(old.id)
  }catch(e){console.warn('safety copy failed',e)}
}
async function autoSnapshot(){try{let l=await snapStore.list();if(l.some(s=>s.kind==='daily'&&s.day===todayISO()))return;await takeSnapshot('Daily copy','daily')}catch(e){}}
async function renderSnapList(){
  let el=document.getElementById('snapList');if(!el)return;

    let l=(await snapStore.list()).sort((a,b)=>b.ts-a.ts);
    el.innerHTML=l.length?`<div class="dz-group-label">Safety copies on this device</div>`+l.slice(0,10).map(s=>`<div class="snap-row"><div>${esc(s.label)}<small>${new Date(s.ts).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${s.count} projects</small></div><button type="button" class="btn small light" onclick="restoreSnapshot('${s.id}')">Restore</button></div>`).join(''):'<p class="plan-intro">Safety copies will appear here after the dashboard has loaded once.</p>'
  }catch(e){el.innerHTML=''}
}
async function restoreSnapshot(id){
  if(lockState){toastMsg('Resolve the red banner first');return}
  try{
    let rec=(await snapStore.list()).find(s=>s.id===id);if(!rec)return;
    if(!confirm('Restore the copy from '+new Date(rec.ts).toLocaleString('en-CA')+'? Your current version is saved as a safety copy first.'))return;
    await takeSnapshot('Before restore','safety');
    let d=JSON.parse(rec.data);
    projects=(d.projects||[]).map(migrate);if(d.settings)settings=d.settings;ensureSettings(settings);
    archive=rec.archiveZ?JSON.parse(await unzipStr(rec.archiveZ)):[];
    localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));archiveDirty=true;await saveArchiveLocal();
    await doCloudSave(true);render();refreshSettings();toastMsg('Restored')
  }catch(e){console.warn(e);toastMsg('Could not restore that copy')}
}

function calEvents(rs,re,all){
  let ev={};
  const add=(date,e)=>{if(!date||date<rs||date>re)return;if(!all&&!calFilters[e.type])return;(ev[date]=ev[date]||[]).push(e)};
  const mk=(p,type,o)=>{let c=CH[type];return{pid:p.id,project:p.project||'Untitled Project',type,color:c.color,tc:c.tc,icon:c.icon,style:c.style,tab:'details',...o}};
  projects.forEach(p=>{
    if(p.status==='Complete')return;
    let name=p.project||'Untitled Project',rep=isRepeating(p);
    if(p.deadline&&!rep)add(p.deadline,mk(p,'launch',{text:name,title:name,sub:calKeyLabel('launch'),drag:{kind:'launch',id:''}}));
    if(p.campaignLaunch)add(p.campaignLaunch,mk(p,'campaign',{text:name,title:name,sub:calKeyLabel('campaign'),drag:{kind:'campaign',id:''}}));
    (p.tasks||[]).forEach(t=>{if(t.linkedType||!t.date||!t.text)return;add(t.date,mk(p,'task',{text:name+' · '+t.text,title:t.text,sub:'Checklist item',done:!!t.complete,tab:'checklist',drag:{kind:'task',id:t.id}}))});
    (p.socialPosts||[]).forEach(sp=>{if(!sp.date)return;let nm=sp.title||(sp.idea||'Social post').slice(0,40);add(sp.date,mk(p,'social',{text:name+' · '+nm,title:nm,sub:'Social · '+((sp.platforms||[]).join(', ')||'no channel set'),done:sp.status==='Posted',tab:'social',drag:{kind:'social',id:sp.id}}))});
    (p.advertisingPosts||[]).forEach(ad=>{
      let nm=ad.title||(ad.idea||'Ad').slice(0,40),g=adGroup(ad.platform),isNews=ad.platform==='Newspaper';
      if(ad.bookingDeadline)add(ad.bookingDeadline,mk(p,g,{text:(isNews?'Submit · ':'')+name+' · '+nm,title:nm,sub:(ad.platform||'Ad')+(isNews?' · submission deadline':' · deadline'),done:ad.status==='Ran',tab:'advertising',drag:{kind:'ad',id:ad.id}}));
      let rd=adRunDate(ad);
      if(rd)add(rd,mk(p,'newspaper',{style:'outline',text:'Runs · '+name+' · '+nm,title:nm,sub:'Newspaper run date',done:ad.status==='Ran',tab:'advertising'}))
    });
    if(rep&&p.deadline&&(all||calFilters.repeat)){
      add(p.deadline,mk(p,'repeat',{text:name,title:name,sub:'Repeats · '+p.recurrence,repeat:true,drag:{kind:'launch',id:''}}));
      let d=p.deadline,guard=0;
      while(guard++<800){let n=nextOccurrence(p,d);if(!n||n===d||n>re)break;d=n;if(n>=rs)add(n,mk(p,'repeat',{text:name,title:name,sub:'Repeats · '+p.recurrence,repeat:true}))}
    }
  });
  const order={launch:0,campaign:1,social:2,newspaper:3,web:4,paid:5,otherad:6,task:7,repeat:8};
  Object.values(ev).forEach(a=>a.sort((x,y)=>order[x.type]-order[y.type]||x.text.localeCompare(y.text)));
  return ev
}

function renderCalendar(){
  let dates=[],start,end,curYear=new Date().getFullYear();
  if(calMode==='week'){start=calWeek;for(let i=0;i<7;i++)dates.push(addDays(start,i));end=dates[6]}
  else{let off=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate(),weeks=Math.ceil((off+dim)/7);for(let i=0;i<weeks*7;i++)dates.push(isoOf(new Date(calY,calM,1-off+i)));start=dates[0];end=dates[dates.length-1]}
  let ev=calEvents(start,end),today=todayISO(),MAX=3,wk=calMode==='week';
  let cells=dates.map(iso=>{
    let d=parseISO(iso),items=ev[iso]||[],weekend=d.getDay()===0||d.getDay()===6,out=!wk&&d.getMonth()!==calM;
    let chips=(wk?items:items.slice(0,MAX)).map(calChip).join(''),more=(!wk&&items.length>MAX)?`<button type="button" class="cal-more" onclick="event.stopPropagation();openDayPanel('${iso}')">+${items.length-MAX} more</button>`:'';
    return`<div class="cal-cell${out?' out':''}${iso===today?' today':''}${weekend?' wknd':''}" ondragover="calDragOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="calDrop(event,'${iso}',this)" onclick="openDayPanel('${iso}')"><div class="cal-num" title="Open this day">${wk?DOW_NAMES[d.getDay()].slice(0,3)+' ':''}${d.getDate()}</div>${chips}${more}</div>`
  }).join('');
  let title=wk?dateLabel(start)+' – '+dateLabel(end):MONTH_NAMES[calM]+(calY!==curYear?' '+calY:'');
  let legend=CAL_KEYS.map(k=>{let c=CH[k],cls=c.style==='solid'?' solid':c.style==='dash'?' dash':'';return`<button type="button" class="cal-key${cls}${calFilters[k]?'':' off'}" style="--c:${c.color};--tc:${c.tc}" onclick="toggleCalFilter('${k}')"><span class="sw">${c.icon}</span>${esc(calKeyLabel(k))}</button>`}).join('');
  calView.innerHTML=`<section class="cal-wrap"><div class="cal-head"><h2>${esc(title)}</h2><div class="cal-nav"><div class="seg2"><button type="button" class="${wk?'':'on'}" onclick="setCalMode('month')">Month</button><button type="button" class="${wk?'on':''}" onclick="setCalMode('week')">Week</button></div><button type="button" onclick="calStep(-1)" title="Previous">‹</button><button type="button" onclick="calToday()">Today</button><button type="button" onclick="calStep(1)" title="Next">›</button></div></div><div class="cal-legend">${legend}</div><div class="cal-note">Gold and navy are project dates. Tinted items are deadlines and posts you handle. Outlined = a newspaper run date. Dashed = a repeating project. Drag an item to another day to move it, or click a day to add something.</div><div class="cal-scroll"><div class="cal-grid${wk?' week':''}">${DOW_NAMES.map(n=>`<div class="cal-dow">${n.slice(0,3)}</div>`).join('')}${cells}</div></div></section>`
}
function calStep(n){

  renderCalendar()
}

function setCalMode(m){
  m=m==='week'?'week':'month';
  if(m==='week'&&calMode==='month'){let t=todayISO(),td=parseISO(t);calWeek=weekStartISO((td.getFullYear()===calY&&td.getMonth()===calM)?t:isoOf(new Date(calY,calM,1)))}

function moveItemToDate(pid,kind,id,iso){
  let p=projects.find(x=>x.id===pid);if(!p)return{error:'Could not find that project'};
  let linkDate=(type,lid)=>{let t=(p.tasks||[]).find(t=>t.linkedType===type&&t.linkedId===lid);if(t)t.date=iso};
  if(kind==='launch'){if(p.deadline===iso)return{same:true};p.deadline=iso}
  else if(kind==='campaign'){if(p.campaignLaunch===iso)return{same:true};p.campaignLaunch=iso}
  else if(kind==='task'){let t=(p.tasks||[]).find(x=>x.id===id);if(!t)return{error:'Could not find that item'};if(t.date===iso)return{same:true};t.date=iso}
  else if(kind==='social'){let sp=(p.socialPosts||[]).find(x=>x.id===id);if(!sp)return{error:'Could not find that post'};if(sp.date===iso)return{same:true};sp.date=iso;linkDate('social',id)}
  else if(kind==='ad'){
    let ad=(p.advertisingPosts||[]).find(x=>x.id===id);if(!ad)return{error:'Could not find that ad'};if(ad.bookingDeadline===iso)return{same:true};
    if(ad.platform==='Newspaper'&&parseISO(iso).getDay()!==4)return{error:'Newspaper deadlines are Thursdays. Drop it on a Thursday.'};
    ad.bookingDeadline=iso;ad.runDate=ad.platform==='Newspaper'?nextWednesday(iso):'';linkDate('ad',id)
  }else return{error:'That cannot be moved'};
  persist();return{ok:true}
}

  if(o.type==='task'){if(!title)return{error:'Type what needs doing'};tasks.push({id,text:title,date:iso,notes:'',complete:false})}

}

function dpAdd(iso){
  let g=id=>document.getElementById(id),o={type:g('dpType').value,pid:g('dpProject')?g('dpProject').value:'',platform:g('dpAdType').value,title:g('dpTitle').value};
  let r=addCalendarItem(iso,o);
  if(r.error){toastMsg(r.error);return}
  if(r.opened)return;
  render();openDayPanel(iso);toastMsg('Added')
}
function closeDayPanel(){dayOverlay.classList.remove('open');dayPanel.classList.remove('open')}
function setView(v){
  view=v==='calendar'?'calendar':'board';
  localStorage.setItem('jpdView',view);
  boardView.classList.toggle('hidden',view==='calendar');
  calView.classList.toggle('hidden',view!=='calendar');
  vBoard.classList.toggle('on',view==='board');vCal.classList.toggle('on',view==='calendar');
  if(view==='calendar')renderCalendar()
}

/* ---------- Cloud sync, with protection against overwriting your data ---------- */
let cloudSaveTimer=null,retryTimer=null,saving=false,resave=false,warnedFull=false,listenersOn=false;
function showSyncStatus(state){
  if(!syncStatus)return;
  const map={loading:'Loading…',pending:'Unsaved changes…',saving:'Saving to cloud…',synced:'Synced to cloud',offline:'Not saved to cloud yet, retrying',paused:'Editing paused',conflict:'Not saved: changed elsewhere',full:'Cloud storage full'};
  syncStatus.textContent=map[state]||'';
  syncStatus.className='sync-status state-'+state
}
function lockEdits(type,info){lockState={type,info:info||{}};document.body.classList.add('locked');renderBanner();showSyncStatus(type==='error'?'paused':'conflict')}
function clearLock(){lockState=null;document.body.classList.remove('locked');renderBanner()}
function renderBanner(){
  let b=document.getElementById('safety');if(!b)return;
  if(!lockState){b.classList.remove('show');b.innerHTML='';return}
  let t=lockState.type,i=lockState.info,msg,btns;
  if(t==='error'){msg='⚠ Your cloud data could not be loaded, so editing is paused. This protects your projects from being overwritten. Nothing you do here will be saved to the cloud.';btns='<button type="button" class="btn" onclick="retryBoot()">Try again</button>'}
  else if(t==='conflict'){msg='⚠ Your dashboard was changed on another device or tab. Your latest changes in this tab have not been saved.';btns='<button type="button" class="btn" onclick="resolveLoadLatest()">Load the latest</button><button type="button" class="btn alt" onclick="exportData()">Download my copy</button><button type="button" class="btn alt" onclick="resolveOverwrite()">Overwrite with mine</button>'}
  else{msg=`⚠ This save would cut your projects from ${i.oldCount} down to ${i.newCount}. Nothing was saved.`;btns='<button type="button" class="btn" onclick="resolveLoadLatest()">Load the latest</button><button type="button" class="btn alt" onclick="exportData()">Download my copy</button><button type="button" class="btn alt" onclick="resolveOverwrite()">Save anyway</button>'}
  b.innerHTML=`<div class="msg">${msg}</div>${btns}`;b.classList.add('show')
}
function queueCloudSave(){
  if(lockState){showSyncStatus(lockState.type==='error'?'paused':'conflict');return}
  if(typeof window.cloudSave!=='function'){showSyncStatus('offline');return}
  if(cloudVersion===null){showSyncStatus('loading');return}   /* never save before the cloud copy has been loaded */
  showSyncStatus('pending');clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>{cloudSaveTimer=null;doCloudSave(false)},900)
}
async function doCloudSave(force){
  if(lockState&&!force)return;
  if(saving){resave=true;return}
  saving=true;showSyncStatus('saving');
  let archStr=archiveDirty?JSON.stringify(archive):null,z;
  try{if(archStr!==null)z=await zipStr(archStr)}catch(e){console.warn(e)}
  let r;
  try{r=await window.cloudSave({projects,settings},z,cloudVersion,!!force)}catch(e){r={ok:false,reason:'error'}}
  saving=false;
  if(r.ok){
    cloudVersion=r.updatedAt;if(r.bytes)docBytes=r.bytes;
    if(z!==undefined){archiveZ=z;if(JSON.stringify(archive)===archStr)archiveDirty=false}
    if(lockState)clearLock();
    showSyncStatus('synced');
    if(r.bytes>800000&&!warnedFull){warnedFull=true;toastMsg('Cloud storage is over 80% full. See Settings.')}
    if(resave){resave=false;queueCloudSave()}
  }else if(r.reason==='conflict')lockEdits('conflict');
  else if(r.reason==='shrink')lockEdits('shrink',r);
  else if(r.reason==='toolarge'){docBytes=r.bytes||docBytes;showSyncStatus('full');toastMsg('Cloud storage is full, so this was not saved. Free up space in Settings.')}
  else{showSyncStatus('offline');clearTimeout(retryTimer);retryTimer=setTimeout(queueCloudSave,15000)}
}
async function applyCloud(r){
  let d=r.data||{};if(!Array.isArray(d.projects))throw new Error('cloud data has no projects');
  let arch=[];if(r.archiveZ){arch=JSON.parse(await unzipStr(r.archiveZ));if(!Array.isArray(arch))throw new Error('bad archive')}
  let before=JSON.stringify(d.projects)+JSON.stringify(d.settings||{});
  projects=d.projects.map(migrate);
  if(d.settings&&typeof d.settings==='object')settings=d.settings;
  ensureSettings(settings);
  archive=arch;archiveZ=r.archiveZ||'';archiveDirty=false;cloudVersion=r.updatedAt||0;docBytes=r.bytes||0;
  localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
  if(archiveZ)localStorage.setItem(ARCHIVE_KEY,archiveZ);else localStorage.removeItem(ARCHIVE_KEY);
  return before!==JSON.stringify(projects)+JSON.stringify(settings)
}
async function resolveLoadLatest(){
  await takeSnapshot('My changes before loading the latest','safety');
  let r=await window.cloudLoad();
  if(r.status!=='ok'){toastMsg('Still cannot reach the cloud. Try again in a moment.');return}
  try{await applyCloud(r)}catch(e){toastMsg('The cloud copy could not be read');return}
  clearLock();showSyncStatus('synced');render();toastMsg('Loaded the latest version')
}
async function resolveOverwrite(){
  if(!confirm('Replace the cloud copy with what is in this tab? The current cloud copy is saved on this device as a safety copy first.'))return;
  let r=await window.cloudLoad();
  if(r.status==='ok'){await takeSnapshot('Cloud copy before I overwrote it','safety',{projects:(r.data||{}).projects||[],settings:(r.data||{}).settings||settings,archiveZ:r.archiveZ||''});cloudVersion=r.updatedAt}
  else if(r.status==='empty')cloudVersion=0;
  else{toastMsg('Cannot reach the cloud right now');return}
  clearLock();await doCloudSave(true)
}
async function checkRemote(){
  if(lockState||cloudVersion===null||saving||cloudSaveTimer!==null||archiveDirty||drawerOpen()||typeof window.cloudLoad!=='function')return;
  let r=await window.cloudLoad();
  if(r.status==='ok'&&r.updatedAt>cloudVersion&&!saving&&cloudSaveTimer===null&&!drawerOpen()){
    try{await applyCloud(r);render();toastMsg('Updated with your latest changes from another device')}catch(e){console.warn(e)}
  }
}
async function retryBoot(){await boot()}
async function boot(){
  applyAppearance();applyZoom();setView(view);showSyncStatus('loading');document.body.classList.add('locked');
  if(!listenersOn){listenersOn=true;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkRemote()})}
  try{await Promise.race([window.__firebaseReady,new Promise(r=>setTimeout(r,8000))])}catch(_){}
  if(typeof window.cloudLoad!=='function'){await loadLocalArchive();render();lockEdits('error');return}
  let r=await window.cloudLoad();
  if(r.status==='ok'){
    let changed=false;
    try{changed=await applyCloud(r)}catch(e){console.warn(e);await loadLocalArchive();render();lockEdits('error');return}
    clearLock();showSyncStatus('synced');
    await autoSnapshot();
    migrateCompleted();
    if(changed)queueCloudSave()
  }else if(r.status==='empty'){
    cloudVersion=0;await loadLocalArchive();clearLock();migrateCompleted();queueCloudSave()
  }else{
    await loadLocalArchive();render();lockEdits('error');return
  }
  render()
}
boot();
</script></body></html>

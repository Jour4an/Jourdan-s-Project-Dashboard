html{scroll-behavior:smooth}
button,input,select,textarea,.ptab,.tab{transition:background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease}
.board-wrap,.focus-track{scroll-behavior:smooth;scrollbar-width:thin}
.focus-track{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:5px}
.focus-card{flex:0 0 calc((100% - 44px)/5);scroll-snap-align:start;transition:box-shadow .28s ease,border-color .28s ease}
.focus-card:hover{transform:none!important;box-shadow:0 10px 24px #00000022}
.card-shell{--cardAccent:var(--native2);perspective:1200px;scroll-margin-top:120px}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.22,.8,.24,1)}
.card-shell.flipped .card-inner{transform:rotateY(180deg)}
.card-face,.card-back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card{transform:none!important;outline:none!important;border:1.5px solid color-mix(in srgb,var(--cardAccent) 35%,white)!important;box-shadow:0 7px 18px #17233614!important;transition:border-color .3s ease,box-shadow .3s ease!important}
.card:hover{transform:none!important;outline:none!important;border-color:var(--cardAccent)!important;box-shadow:0 10px 25px #1723361c!important}
.card-back{position:absolute;inset:0;transform:rotateY(180deg);color:#fff;padding:15px;border-radius:16px;background:linear-gradient(140deg,#050708 0%,#111 40%,var(--cardAccent) 125%);overflow:auto;cursor:pointer;border:1.5px solid color-mix(in srgb,var(--cardAccent) 50%,white);box-shadow:0 8px 22px #1723361c}
.card-back h3{font:700 15px/1.2 Montserrat,"Segoe UI",sans-serif;margin:0 0 12px;color:#fff}
.back-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:#ffffffb8;margin-top:10px}.back-text{font-size:13px;line-height:1.35;margin-top:3px;color:#fff}
.overlay{display:block!important;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .26s ease,visibility 0s linear .26s}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .26s ease}
.drawer{visibility:hidden;transform:translate3d(100%,0,0)!important;transition:transform .34s cubic-bezier(.22,.8,.24,1),visibility 0s linear .34s!important;will-change:transform}
.drawer.open{visibility:visible;transform:translate3d(0,0,0)!important;transition:transform .34s cubic-bezier(.22,.8,.24,1)!important}
.form,.notebook-wrap{animation:panelFade .18s ease-out}@keyframes panelFade{from{opacity:.35}to{opacity:1}}
@media(max-width:1200px){.focus-card{flex-basis:calc((100% - 22px)/3)}.focus-card:nth-child(n+4){display:block!important}}
@media(max-width:720px){.focus-card{flex-basis:100%}.focus-card:nth-child(n+2){display:block!important}}
@media(prefers-reduced-motion:reduce){html,.board-wrap,.focus-track{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

.plan-empty{text-align:center;color:#8190a2;padding:26px 10px;border:1px dashed #d9dfe8;border-radius:12px}
.asset-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.asset-pill{display:flex;gap:6px;align-items:center;border:1px solid #d5d9e2;border-radius:99px;background:white;padding:6px 11px;font-size:11.5px;font-weight:800;color:#465366;cursor:pointer}
.asset-pill input{width:14px;height:14px;margin:0}
.asset-pill.done{background:color-mix(in srgb,var(--accent) 16%,white);border-color:color-mix(in srgb,var(--accent) 40%,white);color:var(--accent)}
@media(max-width:720px){.plan-row-bottom{grid-template-columns:1fr}}
.health-dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:7px;vertical-align:middle;flex:none}

button{cursor:pointer}

function filtered(){return projects}function healthStatus(p){let t=nextTask(p),d=Math.min(days(t?.date),days(p.deadline));if(d<0)return'overdue';if(d<=3)return'soon';return'ok'}function checklistCounts(p){let list=p.tasks||[];return{total:list.length,done:list.filter(x=>x.complete).length}}function checkNextFromCard(id,taskId,checked){let p=projects.find(x=>x.id===id);if(!p)return;let t=(p.tasks||[]).find(x=>x.id===taskId);if(!t)return;t.complete=checked;persist();render()}function checklistBody(p,t,cnt){if(cnt.total===0)return`<div class="all-done"><strong>Next checklist item</strong>No checklist items</div>`;if(t)return`<label class="next-check" onclick="event.stopPropagation()"><input type="checkbox" onchange="checkNextFromCard('${p.id}','${t.id}',this.checked)"><span><strong>Next checklist item</strong>${esc(t.text)}</span></label><div class="next-item-due"><span class="lbl">Next item due</span>${t.date?dateLabel(t.date):'Not set'}</div><div class="progress-mini">${cnt.done}/${cnt.total} checklist items complete</div>`;return`<div class="all-done"><strong>Next checklist item</strong>All checklist items complete</div><div class="progress-mini">${cnt.done}/${cnt.total} checklist items complete</div>`}function card(p){let t=nextTask(p),hs=healthStatus(p),accent=bucketColor(p.bucket),cnt=checklistCounts(p);return`<div class="card-shell" data-card="${p.id}" data-b="${p.bucket}" style="--cardAccent:${accent}" draggable="true" ondragstart="dragged='${p.id}'" ondragover="dragOverCard(event)" ondragleave="dragLeaveCard(event)" ondrop="dropOnCard(event,'${p.id}','${p.bucket}')"><div class="card-inner"><article class="card card-face" onclick="openProject('${p.id}')"><div class="card-title" style="background:${headerGradient(accent)}"><span class="health-dot ${hs}" title="${hs==='overdue'?'Overdue':hs==='soon'?'Due soon':'On track'}"></span>${esc(p.project||'Untitled Project')}</div><div class="meta"><span>${esc(p.workType||'Project')}</span><span>${esc(p.status||'Not Start function scrollTrack(el,dir){el.scrollBy({left:dir*Math.max(260,el.clientWidth*.82),behavior:'smooth'})}

,this.checked)"><div class="task-text-cell">${tag}${textInput}</div>${dateInput}<input placeholder="Notes" value="${esc(t.notes)}" oninput="taskChange(${i},'notes',this.value)">${removeBtn}</div>`}function checklist(){syncPlanItemsToChecklist();ensureBlank();return`<div class="section">Project Checklist</div><p class="plan-intro">Items tagged Social or Ad are synced automatically from those plans — select the ↗ to edit them there. Type below to add your own tasks.</p><div id="taskList" class="checklist">${draftTasks.map(checkRow).join('')}</div>`}function ensureBlank(){let l=draftTasks.at(-1);if(!l||l.text.trim())draftTasks.push({id:crypto.randomUUID(),text:'',date:'',notes:'',complete:false})}function taskChange(i,k,v){draftTasks[i][k]=v;if(k==='complete')document.querySelector(`[data-i="${i}"]`)?.classList.toggle('done',v);if(k==='text'&&i===draftTasks.length-1&&v.trim()){draftTasks.push({id:crypto.randomUUID(),text:'',date:'',notes:'',complete:false});taskList.insertAdjacentHTML('beforeend',checkRow(draftTasks.at(-1),draftTasks.length-1))}}function removeTask(i){draftTasks.splice(i,1);form.innerHTML=checklist()}

function isPlanItemKept(x){return!!((x.idea&&x.idea.trim())||(x.notes&&x.notes.trim())||(x.title&&x.title.trim())||(x.bookingDeadline&&x.bookingDeadline.trim())||(x.date&&x.date.trim())||(x.platforms&&x.platforms.length))}function keptPlanItems(list){return(list||[]).filter(isPlanItemKept)}
function syncPlanItemsToChecklist(){let wantedSocial=draftSocialPosts.filter(isPlanItemKept),wantedAd=draftAdPosts.filter(isPlanItemKept);draftTasks=draftTasks.filter(t=>{if(!t.linkedType)return true;if(t.linkedType==='social')return wantedSocial.some(s=>s.id===t.linkedId);if(t.linkedType==='ad')return wantedAd.some(a=>a.id===t.linkedId);return true});wantedSocial.forEach(sp=>{let text=(sp.title&&sp.title.trim())?sp.title.trim():('Social post: '+(sp.idea||'').slice(0,60)||'Untitled post');let existing=draftTasks.find(t=>t.linkedType==='social'&&t.linkedId===sp.id);if(existing){existing.text=text;existing.date=sp.date||''}else{draftTasks.push({id:crypto.randomUUID(),text,date:sp.date||'',notes:'',complete:false,linkedType:'social',linkedId:sp.id})}});wantedAd.forEach(ad=>{let text=(ad.title&&ad.title.trim())?ad.title.trim():('Ad: '+(ad.idea||'').slice(0,60)||'Untitled ad');let existing=draftTasks.find(t=>t.linkedType==='ad'&&t.linkedId===ad.id);if(existing){existing.text=text;existing.date=ad.bookingDeadline||''}else{draftTasks.push({id:crypto.randomUUID(),text,date:ad.bookingDeadline||'',notes:'',complete:false,linkedType:'ad',linkedId:ad.id})}})}function merge(base){let fd=new FormData(form),d=Object.fromEntries(fd.entries()),chField=settings.projectFields.find(f=>f.key==='channels');if(chField&&chField.visible)d.channels=fd.getAll('channels');return{...base,...d,tasks:draftTasks.filter(t=>t.text.trim()),socialPosts:keptPlanItems(draftSocialPosts),advertisingPosts:keptPlanItems(draftAdPosts)}}function saveProject(){syncPlanItemsToChecklist();let base=getDraft(),d=tab==='details'?merge(base):{...base,tasks:draftTasks.filter(t=>t.text.trim()),socialPosts:keptPlanItems(draftSocialPosts),advertisingPosts:keptPlanItems(draftAdPosts)};if(!d.project?.trim()){toastMsg('Add a project name');switchTab('details');return}if(!d.bucket){toastMsg('Select a bucket');switchTab('details');return}if(currentId)projects[projects.findIndex(p=>p.id===currentId)]=d;else{d.id=crypto.random function deleteProject(){if(!currentId||!confirm('Delete this project?'))return;projects=projects.filter(p=>p.id!==currentId);persist();closeDrawer();render()}function nextRecurringDate(v,r){return r==='Weekly'?addDays(v,7):r==='Every 2 Weeks'?addDays(v,14):r==='Monthly'?addMonths(v,1):r==='Every 3 Months'?addMonths(v,3):r==='Yearly'?addMonths(v,12):v}function complete(id){let p=projects.find(x=>x.id===id);if(!p)return;let isRecurring=p.recurrence&&p.recurrence!=='None';if(isRecurring){let clone=structuredClone(p);clone.id=crypto.randomUUID();clone.status='Not Started';clone.deadline=nextRecurringDate(p.deadline,p.recurrence);clone.dateCompleted='';clone.order=Math.max(0,...projects.filter(x=>x.bucket===clone.bucket).map(x=>+x.order||0))+1;clone.tasks=(clone.tasks||[]).map(t=>({...t,id:crypto.randomUUID(),complete:false,date:nextRecurringDate(t.date,p.recurrence)}));projects.push(clone)}if(currentId===id)closeDrawer();projects=projects.filter(x=>x.id!==id);persist();render();toastMsg(isRecurring?'Completed — next occurrence created':'Project completed and removed')}function move(id,d){let p=projects.find(x=>x.id===id),a=projects.filter(x=>x.bucket===p.bucket&&x.status!=='Complete').sort((x,y)=>x.order-y.order),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];persist();render()}let dragged,dragOverInfo=null;function reorderWithinBucket(draggedId,bucket,targetId,before){let p=projects.find(x=>x.id===draggedId);if(!p)return;p.bucket=bucket;let list=projects.filter(x=>x.bucket===bucket&&x.status!=='Complete'&&x.id!==draggedId).sort((a,b)=>(a.order||0)-(b.order||0));let idx=targetId?list.findIndex(x=>x.id===targetId):-1;if(idx<0)idx=list.length;else if(!before)idx+=1;list.splice(idx,0,p);list.forEach((x,i)=>{x.order=i+1});persist();render()}function dragOverCard(e){e.preventDefault();e.stopPropagation();let el=e.currentTarget,rect=el.getBoundingClientRect(),before=(e.clientY-rect.top)<rect.height/2;el.classList.toggle('drop-before',before);el.classList.toggle('drop-after',!before);dragOverInfo={before}}function dragLeaveCard(e){e.currentTarget.classList.remove('drop-before','drop-after')}function dropOnCard(e,targetId,bucket){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drop-before','drop-after');let before=dragOverInfo?dragOverInfo.before:true;dragOverInfo=null;if(dragged===targetId)return;reorderWithinBucket(dragged,bucket,targetId,before)}function drop(e,b){e.preventDefault();e.currentTarget.classList.remove('over');reorderWithinBucket(dragged,b,null,true)}
function reorderArrayById(arr,draggedId,targetId,before,idKey){idKey=idKey||'id';let fromIdx=arr.findIndex(x=>x[idKey]===draggedId);if(fromIdx<0)return;let item=arr[fromIdx];arr.splice(fromIdx,1);let idx=targetId!==null&&targetId!==undefined?arr.findIndex(x=>x[idKey]===targetId):-1;if(idx<0)idx=arr.length;else if(!before)idx+=1;arr.splice(idx,0,item)}

function removeBucket(i){let b=settings.buckets[i];if(settings.buckets.length<=1){toastMsg('You need at least one bucket');return}let inUse=projects.some(p=>p.bucket===b.name);if(inUse){toastMsg('Move projects out of '+b.name+' before removing it');return}if(!confirm('Remove the "'+b.name+'" bucket?'))return;settings.buckets.splice(i,1);persistSettings();refreshSettings();toastMsg('Bucket removed')}
const CORE_FIELDS=[{label:'Project Name',type:'text'},{label:'Bucket',type:'select'},{label:'Priority',type:'select'},{label:'Status',type:'select'},{label:'Deadline / Launch',type:'date'}];
function settingsFieldEditor(){return`<div class="pf-editor"><div class="pf-core-block">${CORE_FIELDS.map(f=>`<div class="pf-core-field"><label>${f.label}</label><div class="pf-core-fake-input">${f.type==='select'?'Dropdown':f.type==='date'?'Date picker':'Text field'}</div></div>`).join('')}<div class="pf-core-note">These core fields always appear first and can't be removed or reordered.</div></div><div class="pf-field-list" id="pfFieldList">${settings.projectFields.map((f,i)=>fieldEditorBox(f,i)).join('')}</div><button type="button" class="btn small plan-add" onclick="addProjectField()">+ Add Field</button></div>`}
function fieldEditorBox(f,i){let typeOptions=[['text','Short text'],['textarea','Long text'],['select','Dropdown'],['url','Link'],['channels','Multi-select']];let needsOptions=f.type==='select'||f.type==='channels';return`<div class="pf-field-box" data-i="${i}" ondragover="pfDragOver(event,${i})" ondragleave="rowDragLeave(event)" ondrop="pfDrop(event,${i})"><div class="pf-field-box-head"><span class="pf-handle" draggable="true" ondragstart="pfDragStart(event,${i})" ondragend="pfDragEnd(event)" title="Drag to reorder">⠿⠿</span><input type="text" class="pf-label-input" value="${esc(f.label)}" onchange="updateFieldProp(${i},'label',this.value)" placeholder="Field label"><select class="pf-type-input" onchange="updateFieldType(${i},this.value)">${typeOptions.map(([v,l])=>`<option value="${v}" ${f.type===v?'selected':''}>${l}</option>`).join('')}</select><button type="button" class="pf-remove" onclick="removeProjectField(${i})" title="Remove field">×</button></div>${needsOptions?`<input type="text" class="pf-options-input" value="${esc(f.options.join(', '))}" onchange="updateFieldOptions(${i},this.value)" placeholder="Comma-separated options (e.g. Option 1, Option 2)">`:''}<div class="pf-field-box-foot"><label class="field-toggle small"><input type="checkbox" ${f.onBack?'checked':''} onchange="updateFieldProp(${i},'onBack',this.checked)">Show on back of card</label></div></div>`}
let pfDraggedKey=null,pfDropKey=null,pfDropBefore=true;function pfDragStart(e,i){safeBlur();try{e.dataTransfer&&e.dataTransfer.setData('text/plain',String(i))}catch(_){}pfDraggedKey=settings.projectFields[i].key;pfDropKey=null}function pfDragOver(e,i){pfDropBefore=rowDragOver(e);pfDropKey=settings.projectFields[i].key}function pfDrop(e,i){e.preventDefault();e.stopPropagation()}function pfDragEnd(e){try{if(pfDraggedKey!==null&&pfDropKey!==null&&pfDraggedKey!==pfDropKey){reorderArrayById(settings.projectFields,pfDraggedKey,pfDropKey,pfDropBefore,'key');persistSettings()}}catch(err){console.error(err)}pfDraggedKey=null;pfDropKey=null;refreshSettings()}
function updateFieldProp(i,key,val){settings.projectFields[i][key]=val;persistSettings();if(key==='onBack')refreshSettings();else refreshSettings()}
function updateFieldType(i,val){let f=settings.projectFields[i];f.type=val;if((val==='select'||val==='channels')&&!f.options.length)f.options=['Option 1','Option 2'];persistSettings();refreshSettings()}
function updateFieldOptions(i,val){settings.projectFields[i].options=val.split(',').map(x=>x.trim()).filter(Boolean);persistSettings();render()}
function addProjectField(){let key='custom_'+crypto.randomUUID().slice(0,8);settings.projectFields.push({key,label:'New Field',type:'text',options:[],visible:true,onBack:false,backStyle:'line'});persistSettings();refreshSettings();toastMsg('Field added')}
function removeProjectField(i){let f=settings.projectFields[i];if(!confirm('Remove the "'+f.label+'" field? This deletes its data from every project.'))return;settings.projectFields.splice(i,1);projects.forEach(p=>{delete p[f.key]});persist();persistSettings();refreshSettings();toastMsg('Field removed')}
function exportData(){let payload={projects,settings},b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jourdans-project-dashboard-backup.json';a.click();toastMsg('Backup exported')}
function importData(e){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let importedProjects=Array.isArray(x)?x:x.projects;if(!Array.isArray(importedProjects))throw new Error('bad file');projects=importedProjects.map(migrate);persist();if(x.settings){settings=x.settings;if(!Array.isArray(settings.buckets)||!settings.buckets.length)settings.buckets=structuredClone(DEFAULT_BUCKETS);if(!Array.isArray(settings.projectFields)||!settings.projectFields.length)settings.projectFields=structuredClone(DEFAULT_PROJECT_FIELDS);persistSettings()}refreshSettings();toastMsg('Backup imported')}catch{alert('That file could not be read as a valid backup.')}};if(e.target.files[0])r.readAsText(e.target.files[0])}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}applyAppearance();applyZoom();render();
</script></body></html>
